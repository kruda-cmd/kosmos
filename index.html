ву гру') + '\u003c/button>\u003c/div>\u003c/div>\u003c/div>';\r\n  box.innerHTML = h;\r\n}\r\nfunction hostLoginUI() {\r\n  const v = $('#pinIn').value.trim();\r\n  call('hostLogin', v).then(ok => { if (ok) { PIN = v; sstore('pfn_pin', v); HOST_OK = true; renderPult(); } else toast('Неправильний PIN'); }).catch(e => toast('⚠️ ' + (e.message || e)));\r\n}\r\nfunction hostAct(a, p) {\r\n  if (HOST_BUSY) return; HOST_BUSY = true;\r\n  document.querySelectorAll('.pult .btn').forEach(b => b.disabled = true);\r\n  call('hostAction', PIN, a, p || {}).then(() => { VER = ''; poll(); }).catch(e => toast('⚠️ ' + (e.message || e))).then(() => { HOST_BUSY = false; setTimeout(renderPult, 50); });\r\n}\r\nfunction kick(pid) { if (CONFIRM !== 'k' + pid) { CONFIRM = 'k' + pid; toast('Натисни ✕ ще раз, щоб прибрати ' + pname(pid)); setTimeout(() => { CONFIRM = ''; }, 3000); return; } CONFIRM = ''; hostAct('kick', { pid }); }\r\n/* Нова гра: подвійне натискання, щоб не скинути випадково. Гравці заходять знову одним дотиком (ім'я й прибулець запам'ятовуються) */\r\nfunction newGame(btn) {\r\n  if (CONFIRM !== 'new') { CONFIRM = 'new'; if (btn) btn.textContent = 'Точно? Натисни ще раз'; else renderPult(); setTimeout(() => { if (CONFIRM === 'new') { CONFIRM = ''; if (btn) btn.textContent = '🔄 Нова гра'; renderPult(); } }, 4000); return; }\r\n  CONFIRM = ''; hostAct('reset'); toast('🪐 Нова гра! Гравці знову сканують QR-код');\r\n}\r\nfunction resetGame() { if (CONFIRM !== 'reset') { CONFIRM = 'reset'; renderPult(); setTimeout(() => { if (CONFIRM === 'reset') { CONFIRM = ''; renderPult(); } }, 4000); return; } CONFIRM = ''; hostAct('reset'); }\r\n\r\n/* ================= ГОЛОВНЕ ================= */\r\nfunction render() {\r\n  if (!S) return;\r\n  if (IS_SCREEN) renderScreen();\r\n  if (IS_PLAYER) renderPlayer();\r\n  if (IS_PULT) renderPult();\r\n}\r\n/* Таймер оновлюється кожні 250 мс */\r\nsetInterval(() => {\r\n  if (!S) return;\r\n  const tl = timeLeft(); const tot = S.timer.total || 1;\r\n  document.querySelectorAll('.js-timer').forEach(e => { e.textContent = tl == null ? '—' : mmss(tl); });\r\n  const st = $('#sTimer'); if (st) { st.classList.toggle('hidden', tl == null); st.classList.toggle('low', tl != null && tl \u003c 15000); const c = $('#sTimerC'); if (c && tl != null) { c.setAttribute('stroke-dashoffset', String(226 - 226 * Math.min(1, tl / tot))); c.setAttribute('stroke', tl \u003c 15000 ? '#FF4D6D' : '#2EE6C8'); } }\r\n  const tb = $('#ptbar'); if (tb) { tb.classList.toggle('hidden', tl == null); tb.classList.toggle('low', tl != null && tl \u003c 15000); if (tl != null) tb.firstChild.style.width = Math.min(100, tl / tot * 100) + '%'; }\r\n}, 250);\r\ndocument.addEventListener('keydown', e => {\r\n  if (MODE !== 'host' || !HOST_OK || /input|textarea/i.test((e.target || {}).tagName)) return;\r\n  if (e.key === 'ArrowRight') hostAct('next');\r\n  if (e.key === 'ArrowLeft') hostAct('prev');\r\n  if (e.key === 'p' || e.key === 'з') toggleDrawer();\r\n});\r\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });\r\nstars();\r\nif (IS_SCREEN) buildScreenShell();\r\nif (IS_PULT && PIN) call('hostLogin', PIN).then(ok => { HOST_OK = !!ok; render(); }).catch(() => {});\r\nif (IS_PULT && !IS_SCREEN) renderPult();\r\nif (IS_PLAYER) $('#app').innerHTML = '\u003cdiv class=\"ph\">\u003cdiv class=\"card done\">\u003cdiv class=\"big\" style=\"animation:spin 2s linear infinite;display:inline-block\">🪐\u003c/div>\u003ch3>Зв\\'язуємось із планетою…\u003c/h3>\u003c/div>\u003c/div>';\r\npoll();\r\n";          // код сторінки гри (з Index.html)
  const ENGINE_SRC = "/**\r\n * 🪐 КОСМОС У КИШЕНІ — командна гра-конструктор світу (світ створюється з телефонів гравців)\r\n * Таблиця з даними + сайт (вебзастосунок Apps Script)\r\n *\r\n * Режими сайту:\r\n *   …/exec            — гравці (телефон кожного учасника, вхід через QR-код)\r\n *   …/exec?screen=1   — великий екран для трансляції в Google Meet (без керування)\r\n *   …/exec?host=1     — великий екран + шухляда з пультом (потрібен PIN)\r\n *   …/exec?pult=1     — лише пульт ведучого (зручно з телефона, потрібен PIN)\r\n *\r\n * Аркуші, які можна редагувати руками: «Налаштування», «Етапи», «Репліки КОМПИ», «Картки», «Кризи», «Звання».\r\n * Аркуші, які заповнює гра: «Гравці», «Внески», «Паспорт планети».\r\n */\r\n\r\n/* ================= НАЛАШТУВАННЯ ================= */\r\nconst SS_ID = '16_diTo5MFssWZq2IcxmV-BCm6JPaHihXgY71vMdsNxU'; // таблиця гри (шукаємо за ID)\r\nconst FONT = 'Unbounded';                                     // шрифт таблиці (завжди Unbounded)\r\nconst STYLE_VERSION = '1';                                    // збільшити, щоб сайт ще раз оформив таблицю\r\nconst SH = {\r\n  settings: 'Налаштування', stages: 'Етапи', lines: 'Репліки КОМПИ', cards: 'Картки', crises: 'Кризи', titles: 'Звання',\r\n  players: 'Гравці', contrib: 'Внески', passport: 'Паспорт планети'\r\n};\r\nconst MENU = '🪐 Космос у кишені';\r\n\r\n/* Порядок гри: [етап, крок]. Ведучий натискає «Далі» і переходить на наступний рядок */\r\nconst FLOW = [\r\n  ['lobby', 'join'], ['intro', 'legend'],\r\n  ['land', 'input'], ['land', 'vote'], ['land', 'reveal'],\r\n  ['name', 'input'], ['name', 'vote'], ['name', 'reveal'],\r\n  ['cities', 'split'], ['cities', 'wheel'], ['cities', 'input'], ['cities', 'vote'], ['cities', 'reveal'],\r\n  ['laws', 'input'], ['laws', 'vote'], ['laws', 'reveal'],\r\n  ['crisis', 'alarm'], ['crisis', 'input'], ['crisis', 'reveal'],\r\n  ['power', 'input'], ['power', 'vote'], ['power', 'reveal'],\r\n  ['contact', 'input'], ['contact', 'reveal'],\r\n  ['final', 'passport'], ['final', 'awards']\r\n];\r\n/* Континенти (кольори й назви) — для етапу «Міста» */\r\nconst CONTINENTS = [\r\n  { n: 'Пурпурний континент', c: '#B57CFF', e: '🟣' },\r\n  { n: 'Бірюзовий континент', c: '#2EE6C8', e: '🟢' },\r\n  { n: 'Помаранчевий континент', c: '#FF9A4D', e: '🟠' },\r\n  { n: 'Рожевий континент', c: '#FF6FB5', e: '🩷' }\r\n];\r\n\r\n/* ================= МЕНЮ В ТАБЛИЦІ ================= */\r\nfunction onOpen() {\r\n  SpreadsheetApp.getUi().createMenu(MENU)\r\n    .addItem('Показати посилання на гру', 'showSiteUrl')\r\n    .addItem('Створити відсутні аркуші', 'setupSheetsMenu')\r\n    .addItem('Оформити таблицю (шрифт ' + FONT + ')', 'styleSheetsMenu')\r\n    .addSeparator()\r\n    .addItem('Скинути гру (нова планета)', 'resetGameMenu')\r\n    .addToUi();\r\n}\r\n\r\n/* Показує посилання для гравців, екрана і ведучого */\r\nfunction showSiteUrl() {\r\n  const url = ScriptApp.getService().getUrl();\r\n  SpreadsheetApp.getUi().alert(url\r\n    ? 'Гравцям (QR-код буде на екрані):\\n' + url + '\\n\\nЕкран для Google Meet:\\n' + url + '?screen=1\\n\\nЕкран + пульт ведучого:\\n' + url + '?host=1\\n\\nЛише пульт (з телефона):\\n' + url + '?pult=1\\n\\nPIN ведучого — на аркуші «Налаштування».'\r\n    : 'Сайт ще не розгорнуто.\\nРозширення → Apps Script → Розгорнути → Нове розгортання → Вебзастосунок.');\r\n}\r\n\r\n/* ПЕРШИЙ ЗАПУСК: оберіть цю функцію в редакторі Apps Script і натисніть «Виконати», щоб надати дозволи */\r\nfunction setup() {\r\n  const n = setupSheets_();\r\n  styleAllSheets_();\r\n  CacheService.getScriptCache().remove('CFG');\r\n  const url = ScriptApp.getService().getUrl();\r\n  console.log('Готово! Створено аркушів: ' + n + '. Посилання на гру: ' + url);\r\n  return url;\r\n}\r\n\r\n/* Створює аркуші, яких бракує (наявні не чіпає) */\r\nfunction setupSheetsMenu() {\r\n  const n = setupSheets_();\r\n  if (n) styleAllSheets_();\r\n  SpreadsheetApp.getActive().toast(n ? 'Готово: створено аркушів — ' + n : 'Усі аркуші вже на місці.', MENU, 5);\r\n}\r\n\r\n/* Скидає стан гри (записи в аркушах-журналах лишаються) */\r\nfunction resetGameMenu() {\r\n  const ui = SpreadsheetApp.getUi();\r\n  if (ui.alert('Почати нову планету?', 'Гравці, відповіді й планета на сайті обнуляться. Записи в аркушах «Гравці», «Внески», «Паспорт планети» залишаться.', ui.ButtonSet.YES_NO) !== ui.Button.YES) return;\r\n  resetState_();\r\n  SpreadsheetApp.getActive().toast('Готово: гру скинуто, можна будувати нову планету.', MENU, 5);\r\n}\r\n\r\n/* Нові записи в таблиці одразу отримують фірмовий шрифт */\r\nfunction onEdit(e) { if (e && e.range) e.range.setFontFamily(FONT); }\r\n\r\n/* ================= САЙТ ================= */\r\nfunction doGet(e) {\r\n  const p = (e && e.parameter) || {};\r\n  const mode = p.host ? 'host' : (p.pult ? 'pult' : (p.screen ? 'screen' : 'player'));\r\n  setupSheets_();\r\n  ensureStyle_();\r\n  const cfg = getConfig_();\r\n  const t = HtmlService.createTemplateFromFile('Index');\r\n  t.mode = mode;\r\n  const c = clientCfg_(cfg);\r\n  c.mode = mode;\r\n  c.url = ScriptApp.getService().getUrl();\r\n  t.data = JSON.stringify(c).replace(/\u003c/g, '\\\\u003c');\r\n  return t.evaluate()\r\n    .setTitle(cfg.settings.title || 'Космос у кишені')\r\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1')\r\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\r\n}\r\n\r\n/* ================= ВХІД ДЛЯ САЙТУ НА GITHUB PAGES + FIREBASE ================= */\r\n// Сайт на GitHub надсилає сюди {fn, args} і отримує {result} або {error}.\r\n// Сама гра йде через Firebase; Google потрібен для налаштувань з таблиці, музики й запису результатів.\r\nconst API_FNS_ = { getState, joinGame, submit, hostLogin, hostAction, getMusic, writeLogsFrom };\r\n\r\n/* Результати гри з версії на GitHub: пульт надсилає стан гри, ми записуємо аркуші «Гравці», «Внески», «Паспорт планети» */\r\nfunction writeLogsFrom(pin, st, all, planet, dust, awards) {\r\n  if (!checkPin_(pin)) throw new Error('Неправильний PIN');\r\n  writeLogs_(st || {}, getConfig_(), all || {}, planet || {}, dust || {}, awards || { t: {}, total: {} });\r\n  return true;\r\n}\r\nfunction doPost(e) {\r\n  let out;\r\n  try {\r\n    const b = JSON.parse((e && e.postData && e.postData.contents) || '{}');\r\n    const args = Array.isArray(b.args) ? b.args : [];\r\n    if (b.fn === 'config') { const cfg = getConfig_(); const c = clientCfg_(cfg); c.mode = args[0] || 'player'; c.title = cfg.settings.title; out = { result: c }; }\r\n    else if (Object.prototype.hasOwnProperty.call(API_FNS_, b.fn)) out = { result: API_FNS_[b.fn].apply(null, args) };\r\n    else throw new Error('Невідома дія');\r\n  } catch (err) {\r\n    out = { error: String((err && err.message) || err) };\r\n  }\r\n  if (out.result === undefined) out.result = null;\r\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\r\n}\r\n\r\n/* ================= ЧИТАННЯ НАЛАШТУВАНЬ З ТАБЛИЦІ ================= */\r\nfunction ss_() { return SpreadsheetApp.openById(SS_ID); }\r\nfunction rows_(name) {\r\n  const sh = ss_().getSheetByName(name);\r\n  if (!sh || sh.getLastRow() \u003c 2) return [];\r\n  return sh.getRange(2, 1, sh.getLastRow() - 1, sh.getLastColumn()).getValues()\r\n    .filter(r => r.some(x => String(x).trim() !== ''));\r\n}\r\nconst str_ = v => String(v == null ? '' : v).trim();\r\nconst num_ = (v, d) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? d : n; };\r\n\r\n/* Збирає всі налаштування в один об'єкт (кешуємо на 1 хвилину, щоб сайт працював швидко) */\r\nfunction getConfig_() {\r\n  const cache = CacheService.getScriptCache();\r\n  const hit = cache.get('CFG');\r\n  if (hit) return JSON.parse(hit);\r\n  const s = {};\r\n  rows_(SH.settings).forEach(r => { s[str_(r[0])] = str_(r[1]); });\r\n  const settings = {\r\n    title: s['Назва гри'] || 'Космос у кишені',\r\n    pin: s['PIN ведучого'] || '2026',\r\n    defaultName: s['Назва планети, якщо ніхто не придумав'] || 'Кишенькова планета',\r\n    lawsTop: Math.max(3, Math.min(7, num_(s['Законів у Конституції'], 5))),\r\n    crisisNo: num_(s['Номер кризи (порожньо = випадкова)'], 0),\r\n    lawStarts: (s['Початки законів (через ;)'] || \"Кожен мешканець зобов'язаний;Кожен мешканець має право;На планеті суворо заборонено\").split(';').map(x => x.trim()).filter(Boolean),\r\n    music: { intro: s['Музика заставки'] || '', game: s['Музика гри'] || '', final: s['Музика фіналу'] || '' },\r\n    volume: Math.max(0, Math.min(100, num_(s['Гучність музики (0–100)'], 40))),\r\n    synth: !/^ні|no|0$/i.test(s['Космічний звук, якщо немає музики (так/ні)'] || 'так')\r\n  };\r\n  const stages = {};\r\n  rows_(SH.stages).forEach(r => {\r\n    stages[str_(r[0])] = { title: str_(r[1]), emoji: str_(r[2]), inMin: num_(r[3], 0), voteMin: num_(r[4], 0), taskIn: str_(r[5]), taskVote: str_(r[6]) };\r\n  });\r\n  const lines = {};\r\n  rows_(SH.lines).forEach(r => { lines[str_(r[0])] = { say: str_(r[1]), hint: str_(r[2]) }; });\r\n  const cards = { land: [], role: [], mod: [], power: [] };\r\n  const TYPES = { 'ландшафт': 'land', 'роль': 'role', 'модифікатор': 'mod', 'суперсила': 'power' };\r\n  rows_(SH.cards).forEach((r, i) => {\r\n    const t = TYPES[str_(r[0]).toLowerCase()];\r\n    if (!t) return;\r\n    cards[t].push({ id: str_(r[1]) || (t + i), e: str_(r[2]), n: str_(r[3]), d: str_(r[4]), c: str_(r[5]) || '#8B5CF6', q: str_(r[6]), ideas: str_(r[7]).split(';').map(x => x.trim()).filter(Boolean) });\r\n  });\r\n  const crises = rows_(SH.crises).map(r => ({\r\n    e: str_(r[1]), n: str_(r[2]), d: str_(r[3]),\r\n    opts: [0, 1, 2, 3].map(k => ({ t: str_(r[4 + k * 2]), out: str_(r[5 + k * 2]) })).filter(o => o.t)\r\n  })).filter(c => c.n && c.opts.length >= 2);\r\n  const titles = rows_(SH.titles).map(r => ({ k: str_(r[0]).toLowerCase(), e: str_(r[1]), n: str_(r[2]), d: str_(r[3]) })).filter(t => t.n);\r\n  const cfg = { settings, stages, lines, cards, crises, titles };\r\n  try { cache.put('CFG', JSON.stringify(cfg), 60); } catch (e) { /* завеликий для кешу — просто не кешуємо */ }\r\n  return cfg;\r\n}\r\n\r\n/* Що з налаштувань бачить сайт (без PIN) */\r\nfunction clientCfg_(cfg) {\r\n  const s = Object.assign({}, cfg.settings);\r\n  delete s.pin;\r\n  return { settings: s, stages: cfg.stages, lines: cfg.lines, cards: cfg.cards, crises: cfg.crises, titles: cfg.titles, flow: FLOW, continents: CONTINENTS };\r\n}\r\n\r\n/* ================= МУЗИКА З GOOGLE DRIVE ================= */\r\nfunction driveId_(u) {\r\n  const m = String(u || '').match(/[-\\w]{25,}/);\r\n  return m ? m[0] : '';\r\n}\r\nconst MUSIC_PART = 1500000; // розмір однієї частини (символів), щоб відповідь сервера не була завеликою\r\n/* Віддає mp3 з Drive частинами (Drive не дає програвати файли напряму з іншого сайту) */\r\nfunction getMusic(slot, part) {\r\n  const link = (getConfig_().settings.music || {})[slot];\r\n  if (!link) return { total: 0 };\r\n  const id = driveId_(link);\r\n  if (!id) return { total: 1, url: link };\r\n  const blob = DriveApp.getFileById(id).getBlob();\r\n  const b64 = Utilities.base64Encode(blob.getBytes());\r\n  const total = Math.ceil(b64.length / MUSIC_PART);\r\n  part = +part || 0;\r\n  return { total, type: blob.getContentType() || 'audio/mpeg', data: b64.slice(part * MUSIC_PART, (part + 1) * MUSIC_PART) };\r\n}\r\n\r\n/* ================= СТАН ГРИ ================= */\r\n// STATE — хід гри й гравці; PLANET — що вже збудовано; DUST — зоряний пил за етапами; AWARDS — звання.\r\n// Відповіді гравців лежать окремо: ключ «S|етап|крок|гравець», тож гравці не заважають одне одному.\r\nconst props_ = () => PropertiesService.getScriptProperties();\r\nfunction load_(key, def) { const v = props_().getProperty(key); return v ? JSON.parse(v) : def; }\r\nfunction save_(key, obj) { props_().setProperty(key, JSON.stringify(obj)); }\r\nfunction subKey_(stage, step, pid) { return 'S|' + stage + '|' + step + '|' + pid; }\r\n\r\nfunction freshState_() {\r\n  return {\r\n    gameId: Utilities.formatDate(new Date(), 'Europe/Kyiv', 'yyyy-MM-dd HH:mm'),\r\n    i: 0, stepAt: Date.now(), timer: { end: 0, total: 0, paused: false, left: 0 },\r\n    players: {}, order: [], teams: [], crisis: -1, powerOpts: []\r\n  };\r\n}\r\nfunction getStateObj_() { return load_('STATE', null) || freshState_(); }\r\n\r\n/* Позначає, що щось змінилось: телефони й екран підтягнуть новий стан */\r\nfunction bump_() {\r\n  const v = String(Date.now()) + Math.floor(Math.random() * 1000);\r\n  CacheService.getScriptCache().put('VER', v, 21600);\r\n  return v;\r\n}\r\nfunction commit_(st) { save_('STATE', st); bump_(); }\r\n\r\n/* Виконує зміну під замком, щоб одночасні дії не затерли одна одну */\r\nfunction withLock_(fn) {\r\n  const lock = LockService.getScriptLock();\r\n  lock.waitLock(20000);\r\n  try { return fn(); } finally { lock.releaseLock(); }\r\n}\r\n\r\nfunction resetState_() {\r\n  withLock_(() => {\r\n    const p = props_();\r\n    const oldVol = (load_('STATE', null) || {}).vol; // гучність лишається такою, як була\r\n    Object.keys(p.getProperties()).forEach(k => { if (k !== 'STYLE_V') p.deleteProperty(k); });\r\n    const fresh = freshState_();\r\n    if (oldVol != null) fresh.vol = oldVol;\r\n    commit_(fresh);\r\n  });\r\n}\r\n\r\n/* Усі відповіді гравців для одного етапу: { крок: { гравець: значення } } */\r\nfunction subsFor_(all, stage) {\r\n  const out = {};\r\n  const pre = 'S|' + stage + '|';\r\n  Object.keys(all).forEach(k => {\r\n    if (k.indexOf(pre) !== 0) return;\r\n    const parts = k.split('|');\r\n    (out[parts[2]] = out[parts[2]] || {})[parts[3]] = JSON.parse(all[k]);\r\n  });\r\n  return out;\r\n}\r\n\r\n/* ================= ЗАПИТИ З САЙТУ ================= */\r\n/* Стан гри. Якщо нічого не змінилося — коротка відповідь «без змін» */\r\nfunction getState(clientVer) {\r\n  const cache = CacheService.getScriptCache();\r\n  let ver = cache.get('VER');\r\n  if (ver && clientVer && String(clientVer) === ver) return { same: true, now: Date.now() };\r\n  if (!ver) ver = bump_();\r\n  const all = props_().getProperties();\r\n  const st = all.STATE ? JSON.parse(all.STATE) : freshState_();\r\n  const stage = FLOW[st.i][0];\r\n  return {\r\n    ver, now: Date.now(), st,\r\n    planet: all.PLANET ? JSON.parse(all.PLANET) : {},\r\n    dust: all.DUST ? JSON.parse(all.DUST) : {},\r\n    awards: all.AWARDS ? JSON.parse(all.AWARDS) : {},\r\n    subs: subsFor_(all, stage)\r\n  };\r\n}\r\n\r\n/* Гравець приєднується (або оновлює свого прибульця) */\r\nfunction joinGame(pid, name, alien) {\r\n  pid = str_(pid).replace(/[^\\w-]/g, '').slice(0, 24);\r\n  name = str_(name).replace(/\\s+/g, ' ').slice(0, 20);\r\n  if (!pid || !name) throw new Error('Введіть ім\\'я');\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    const old = st.players[pid];\r\n    const a = {};\r\n    ['b', 'c', 'y', 'm', 'x'].forEach(k => { a[k] = Math.max(0, Math.min(20, parseInt((alien || {})[k], 10) || 0)); });\r\n    st.players[pid] = Object.assign(old || {}, { n: name, a });\r\n    if (!old) {\r\n      st.order.push(pid);\r\n      if (st.teams.length) placeInTeam_(st, pid); // запізнився — одразу на континент\r\n    }\r\n    commit_(st);\r\n    return { ok: true };\r\n  });\r\n}\r\n\r\n/* Що можна надсилати на кожному кроці і як це перевірити */\r\nconst SUBMIT_RULES_ = {\r\n  'land|input': v => str_(v).slice(0, 30),\r\n  'land|vote': v => str_(v).slice(0, 30),\r\n  'name|input': v => str_(v).replace(/\\s+/g, ' ').slice(0, 24),\r\n  'name|vote': v => str_(v).slice(0, 24),\r\n  'cities|input': v => str_(v).replace(/\\s+/g, ' ').slice(0, 90),\r\n  'cities|vote': v => str_(v).slice(0, 4),\r\n  'laws|input': v => ({ p: Math.max(0, Math.min(5, parseInt(v && v.p, 10) || 0)), t: str_(v && v.t).replace(/\\s+/g, ' ').slice(0, 100) }),\r\n  'laws|vote': v => { const o = {}; Object.keys(v || {}).slice(0, 40).forEach(k => { o[k.slice(0, 24)] = v[k] > 0 ? 1 : -1; }); return o; },\r\n  'crisis|input': v => { let left = 10; return [0, 1, 2, 3].map(k => { const n = Math.max(0, Math.min(left, parseInt((v || [])[k], 10) || 0)); left -= n; return n; }); },\r\n  'power|input': v => ({ p: str_(v && v.p).slice(0, 30), h: str_(v && v.h).replace(/\\s+/g, ' ').slice(0, 40) }),\r\n  'power|vote': v => str_(v).slice(0, 24),\r\n  'contact|input': v => str_(v).replace(/\\s+/g, '').slice(0, 20)\r\n};\r\n\r\n/* Відповідь гравця на поточному кроці (без замка: кожен пише у свою клітинку) */\r\nfunction submit(pid, stage, step, value) {\r\n  const st = getStateObj_();\r\n  const cur = FLOW[st.i];\r\n  if (cur[0] !== stage || cur[1] !== step) return { ok: false, late: true };\r\n  if (!st.players[pid]) return { ok: false, unknown: true };\r\n  const rule = SUBMIT_RULES_[stage + '|' + step];\r\n  if (!rule) return { ok: false };\r\n  const v = rule(value);\r\n  if (v === '' || (v && v.t === '' && stage === 'laws')) return { ok: false, empty: true };\r\n  const key = subKey_(stage, step, pid);\r\n  const old = props_().getProperty(key);\r\n  const t = old ? JSON.parse(old).t : Date.now(); // час першої відповіді — для звання «найшвидший»\r\n  props_().setProperty(key, JSON.stringify({ v, t }));\r\n  bump_();\r\n  return { ok: true };\r\n}\r\n\r\n/* ================= ВЕДУЧИЙ ================= */\r\nfunction checkPin_(pin) { return str_(pin) !== '' && str_(pin) === str_(getConfig_().settings.pin); }\r\nfunction hostLogin(pin) { return checkPin_(pin); }\r\n\r\n/* Дії з пульта: далі / назад / таймер / видалити гравця / скинути гру */\r\nfunction hostAction(pin, action, p) {\r\n  if (!checkPin_(pin)) throw new Error('Неправильний PIN');\r\n  p = p || {};\r\n  if (action === 'reset') { resetState_(); return { ok: true }; }\r\n  if (action === 'reload') { CacheService.getScriptCache().remove('CFG'); bump_(); return { ok: true }; }\r\n  return withLock_(() => {\r\n    const st = getStateObj_();\r\n    const cfg = getConfig_();\r\n    if (action === 'next' || action === 'prev' || action === 'goto') {\r\n      const to = action === 'next' ? st.i + 1 : action === 'prev' ? st.i - 1 : parseInt(p.i, 10);\r\n      if (isNaN(to) || to \u003c 0 || to >= FLOW.length) return { ok: false };\r\n      st.i = to;\r\n      st.stepAt = Date.now();\r\n      enterStep_(st, cfg, action !== 'prev');\r\n    } else if (action === 'timerAdd') {\r\n      const add = (parseInt(p.sec, 10) || 30) * 1000;\r\n      if (st.timer.paused) st.timer.left += add;\r\n      else st.timer.end = Math.max(st.timer.end, Date.now()) + add;\r\n      st.timer.total += add;\r\n    } else if (action === 'timerPause') {\r\n      if (st.timer.paused) { st.timer.end = Date.now() + st.timer.left; st.timer.paused = false; }\r\n      else if (st.timer.end > Date.now()) { st.timer.left = st.timer.end - Date.now(); st.timer.paused = true; }\r\n    } else if (action === 'timerStop') {\r\n      st.timer = { end: 0, total: 0, paused: false, left: 0 };\r\n    } else if (action === 'kick') {\r\n      delete st.players[p.pid];\r\n      st.order = st.order.filter(x => x !== p.pid);\r\n      st.teams.forEach(t => { t.m = t.m.filter(x => x !== p.pid); });\r\n    } else if (action === 'volume') {\r\n      st.vol = Math.max(0, Math.min(100, parseInt(p.v, 10) || 0)); // гучність на екрані гри\r\n    } else if (action === 'reteam') {\r\n      st.teams = [];\r\n      makeTeams_(st, cfg);\r\n    }\r\n    commit_(st);\r\n    return { ok: true };\r\n  });\r\n}\r\n\r\n/* Що відбувається при вході на крок: таймер, жеребкування, підрахунок результатів */\r\nfunction enterStep_(st, cfg, forward) {\r\n  const [stage, step] = FLOW[st.i];\r\n  const sc = cfg.stages[stage] || {};\r\n  const min = step === 'input' ? sc.inMin : step === 'vote' ? sc.voteMin : 0;\r\n  st.timer = min > 0 ? { end: Date.now() + min * 60000 + 1500, total: min * 60000, paused: false, left: 0 } : { end: 0, total: 0, paused: false, left: 0 };\r\n  if (!forward) return;\r\n  if (stage === 'cities' && step === 'split' && !st.teams.length) makeTeams_(st, cfg);\r\n  if (stage === 'cities' && step === 'wheel') {\r\n    const mods = shuffle_(cfg.cards.mod.map(m => m.id));\r\n    st.teams.forEach((t, k) => { t.mod = mods[k % Math.max(1, mods.length)] || ''; });\r\n  }\r\n  if (stage === 'crisis' && step === 'alarm') {\r\n    const n = cfg.crises.length;\r\n    st.crisis = cfg.settings.crisisNo >= 1 && cfg.settings.crisisNo \u003c= n ? cfg.settings.crisisNo - 1 : Math.floor(Math.random() * n);\r\n  }\r\n  if (stage === 'power' && step === 'input' && !st.powerOpts.length) st.powerOpts = shuffle_(cfg.cards.power.map(x => x.id)).slice(0, 4);\r\n  if (step === 'reveal' || stage === 'final') {\r\n    const all = props_().getProperties();\r\n    const planet = all.PLANET ? JSON.parse(all.PLANET) : {};\r\n    const dust = all.DUST ? JSON.parse(all.DUST) : {};\r\n    if (step === 'reveal') REVEAL_[stage](st, cfg, subsFor_(all, stage), planet, dust);\r\n    if (stage === 'final') {\r\n      if (!planet.name) planet.name = cfg.settings.defaultName;\r\n      // Звання роздаємо на кроці «Звання» (або якщо їх ще немає), щоб випадкові звання не мінялися\r\n      const awards = (step === 'awards' || !all.AWARDS) ? makeAwards_(st, cfg, all, planet, dust) : JSON.parse(all.AWARDS);\r\n      save_('AWARDS', awards);\r\n      try { writeLogs_(st, cfg, all, planet, dust, awards); } catch (e) { console.error('Журнал не записано: ' + e); }\r\n    }\r\n    save_('PLANET', planet);\r\n    save_('DUST', dust);\r\n  }\r\n}\r\n\r\n/* ================= КОНТИНЕНТИ І РОЛІ ================= */\r\nfunction makeTeams_(st, cfg) {\r\n  const n = st.order.length;\r\n  const k = n \u003c= 7 ? 2 : n \u003c= 16 ? 3 : 4;\r\n  st.teams = CONTINENTS.slice(0, k).map((c, i) => ({ id: 't' + i, m: [], mod: '' }));\r\n  shuffle_(st.order.slice()).forEach(pid => placeInTeam_(st, pid));\r\n}\r\n/* Кладе гравця на найменший континент і дає наступну роль */\r\nfunction placeInTeam_(st, pid) {\r\n  if (st.teams.some(t => t.m.indexOf(pid) >= 0)) return;\r\n  const t = st.teams.slice().sort((a, b) => a.m.length - b.m.length)[0];\r\n  t.m.push(pid);\r\n}\r\n/* Роль гравця = його номер у складі континенту */\r\nfunction roleOf_(st, cfg, pid) {\r\n  const roles = cfg.cards.role;\r\n  for (const t of st.teams) {\r\n    const k = t.m.indexOf(pid);\r\n    if (k >= 0) return { team: t, role: roles[k % Math.max(1, roles.length)], k };\r\n  }\r\n  return null;\r\n}\r\n\r\n/* ================= ПІДСУМКИ ЕТАПІВ ================= */\r\nconst only_ = (st, m) => { const o = {}; Object.keys(m || {}).forEach(pid => { if (st.players[pid]) o[pid] = m[pid]; }); return o; };\r\nconst vals_ = m => Object.keys(m || {}).map(k => m[k].v);\r\nfunction tally_(arr) { const t = {}; arr.forEach(x => { if (x !== '' && x != null) t[x] = (t[x] || 0) + 1; }); return t; }\r\n/* Переможець голосування; нічия — випадково */\r\nfunction winner_(t, fallback) {\r\n  const keys = Object.keys(t);\r\n  if (!keys.length) return fallback;\r\n  const max = Math.max.apply(null, keys.map(k => t[k]));\r\n  const top = keys.filter(k => t[k] === max);\r\n  return top[Math.floor(Math.random() * top.length)];\r\n}\r\nfunction addDust_(dust, stage, pid, n) { (dust[stage] = dust[stage] || {})[pid] = (dust[stage][pid] || 0) + n; }\r\n\r\nconst REVEAL_ = {\r\n  /* Ландшафт: усі обрані картки на планету, найпопулярніша в голосуванні — Диво */\r\n  land(st, cfg, subs, planet, dust) {\r\n    dust.land = {};\r\n    const picks = only_(st, subs.input), votes = only_(st, subs.vote);\r\n    const cnt = tally_(vals_(picks));\r\n    planet.lands = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 9).map(id => ({ id, n: cnt[id] }));\r\n    planet.wonder = winner_(tally_(vals_(votes)), planet.lands[0] && planet.lands[0].id) || '';\r\n    Object.keys(picks).forEach(pid => addDust_(dust, 'land', pid, picks[pid].v === planet.wonder ? 3 : 1));\r\n    Object.keys(votes).forEach(pid => addDust_(dust, 'land', pid, 1));\r\n  },\r\n  /* Ім'я: голосують за автора назви */\r\n  name(st, cfg, subs, planet, dust) {\r\n    dust.name = {};\r\n    const ins = only_(st, subs.input), votes = only_(st, subs.vote);\r\n    const t = tally_(vals_(votes).filter(pid => ins[pid]));\r\n    const firstPid = Object.keys(ins)[0];\r\n    const win = winner_(t, firstPid);\r\n    planet.name = win && ins[win] ? ins[win].v : cfg.settings.defaultName;\r\n    planet.nameBy = win && ins[win] ? win : '';\r\n    planet.nameVotes = t;\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'name', pid, pid === win ? 4 : 1));\r\n    Object.keys(votes).forEach(pid => addDust_(dust, 'name', pid, 1));\r\n  },\r\n  /* Міста: кожен континент — місто з відповідей ролей; найбільше голосів — Столиця */\r\n  cities(st, cfg, subs, planet, dust) {\r\n    dust.cities = {};\r\n    const ins = only_(st, subs.input), votes = only_(st, subs.vote);\r\n    const t = tally_(vals_(votes));\r\n    planet.cities = st.teams.map((team, k) => {\r\n      const items = team.m.map((pid, j) => {\r\n        const r = cfg.cards.role[j % Math.max(1, cfg.cards.role.length)] || {};\r\n        return { pid, rid: r.id, a: ins[pid] ? ins[pid].v : '' };\r\n      });\r\n      const mayor = items[0] && items[0].a;\r\n      return { id: team.id, k, name: mayor || ('Безіменне місто ' + CONTINENTS[k].e), mod: team.mod, items, votes: t[team.id] || 0 };\r\n    });\r\n    const cap = winner_(t, planet.cities[0] && planet.cities[0].id);\r\n    planet.capital = cap || '';\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'cities', pid, 1));\r\n    Object.keys(votes).forEach(pid => addDust_(dust, 'cities', pid, 1));\r\n    const capTeam = st.teams.filter(x => x.id === cap)[0];\r\n    if (capTeam) capTeam.m.forEach(pid => addDust_(dust, 'cities', pid, 2));\r\n  },\r\n  /* Конституція: закони з найбільшою сумою 👍 мінус 👎 */\r\n  laws(st, cfg, subs, planet, dust) {\r\n    dust.laws = {};\r\n    const ins = only_(st, subs.input), votes = only_(st, subs.vote);\r\n    const score = {};\r\n    Object.keys(ins).forEach(pid => { score[pid] = 0; });\r\n    Object.keys(votes).forEach(v => { const m = votes[v].v || {}; Object.keys(m).forEach(pid => { if (pid in score && pid !== v) score[pid] += m[pid]; }); });\r\n    const order = shuffle_(Object.keys(score)).sort((a, b) => score[b] - score[a]);\r\n    planet.laws = order.slice(0, cfg.settings.lawsTop).map(pid => ({ pid, p: ins[pid].v.p, t: ins[pid].v.t, s: score[pid] }));\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'laws', pid, 1));\r\n    Object.keys(votes).forEach(pid => addDust_(dust, 'laws', pid, 1));\r\n    planet.laws.forEach((l, i) => addDust_(dust, 'laws', l.pid, i === 0 ? 4 : 2));\r\n  },\r\n  /* Криза: перемагає спосіб порятунку з найбільшою кількістю кристалів */\r\n  crisis(st, cfg, subs, planet, dust) {\r\n    dust.crisis = {};\r\n    const ins = only_(st, subs.input);\r\n    const c = cfg.crises[st.crisis] || cfg.crises[0];\r\n    const tot = (c ? c.opts : []).map(() => 0);\r\n    Object.keys(ins).forEach(pid => (ins[pid].v || []).forEach((n, k) => { if (k \u003c tot.length) tot[k] += n; }));\r\n    const max = Math.max.apply(null, tot.concat([0]));\r\n    const top = tot.map((n, k) => n === max ? k : -1).filter(k => k >= 0);\r\n    const win = top[Math.floor(Math.random() * top.length)] || 0;\r\n    planet.crisis = { i: st.crisis, win, tot };\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'crisis', pid, 1 + ((ins[pid].v || [])[win] >= 5 ? 2 : 0)));\r\n  },\r\n  /* Суперсила (найпопулярніша) і головне свято (за голосуванням) */\r\n  power(st, cfg, subs, planet, dust) {\r\n    dust.power = {};\r\n    const ins = only_(st, subs.input), votes = only_(st, subs.vote);\r\n    planet.power = winner_(tally_(Object.keys(ins).map(pid => ins[pid].v.p)), st.powerOpts[0]) || '';\r\n    const hol = {};\r\n    Object.keys(ins).forEach(pid => { if (ins[pid].v.h) hol[pid] = ins[pid].v.h; });\r\n    const win = winner_(tally_(vals_(votes).filter(pid => hol[pid])), Object.keys(hol)[0]);\r\n    planet.holiday = win ? { t: hol[win], by: win } : { t: 'День планети', by: '' };\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'power', pid, 1 + (ins[pid].v.p === planet.power ? 1 : 0) + (pid === win ? 3 : 0)));\r\n    Object.keys(votes).forEach(pid => addDust_(dust, 'power', pid, 1));\r\n  },\r\n  /* Послання Всесвіту: слова в тому порядку, як їх надіслали */\r\n  contact(st, cfg, subs, planet, dust) {\r\n    dust.contact = {};\r\n    const ins = only_(st, subs.input);\r\n    planet.message = Object.keys(ins).sort((a, b) => ins[a].t - ins[b].t).map(pid => ({ pid, w: ins[pid].v }));\r\n    Object.keys(ins).forEach(pid => addDust_(dust, 'contact', pid, 2));\r\n  }\r\n};\r\n\r\n/* ================= ЗВАННЯ ДЛЯ КОЖНОГО ================= */\r\nfunction makeAwards_(st, cfg, all, planet, dust) {\r\n  const pids = st.order.filter(p => st.players[p]);\r\n  const total = {};\r\n  pids.forEach(p => { total[p] = 0; });\r\n  Object.keys(dust).forEach(s => Object.keys(dust[s]).forEach(p => { if (p in total) total[p] += dust[s][p]; }));\r\n  // Хто лідер у кожній номінації\r\n  const lawsVotes = subsFor_(all, 'laws').vote || {};\r\n  const likes = {}, dislikes = {};\r\n  Object.keys(lawsVotes).forEach(p => { const m = lawsVotes[p].v || {}; Object.keys(m).forEach(k => { if (m[k] > 0) likes[p] = (likes[p] || 0) + 1; else dislikes[p] = (dislikes[p] || 0) + 1; }); });\r\n  const firsts = {};\r\n  FLOW.forEach(([stg, stp]) => {\r\n    if (stp !== 'input') return;\r\n    const m = (subsFor_(all, stg).input) || {};\r\n    const first = Object.keys(m).filter(p => p in total).sort((a, b) => m[a].t - m[b].t)[0];\r\n    if (first) firsts[first] = (firsts[first] || 0) + 1;\r\n  });\r\n  const best = m => { const k = Object.keys(m).filter(p => p in total && m[p] > 0).sort((a, b) => m[b] - m[a]); return k[0] || ''; };\r\n  const capTeam = st.teams.filter(t => t.id === planet.capital)[0];\r\n  const crisisIns = subsFor_(all, 'crisis').input || {};\r\n  const crisisBest = {};\r\n  Object.keys(crisisIns).forEach(p => { crisisBest[p] = (crisisIns[p].v || [])[planet.crisis ? planet.crisis.win : 0] || 0; });\r\n  const landIns = subsFor_(all, 'land').input || {};\r\n  const wonderBy = Object.keys(landIns).filter(p => p in total && landIns[p].v === planet.wonder).sort((a, b) => landIns[a].t - landIns[b].t)[0] || '';\r\n  const longest = (planet.message || []).slice().sort((a, b) => b.w.length - a.w.length)[0];\r\n  const cand = {\r\n    name: planet.nameBy || '',\r\n    law: planet.laws && planet.laws[0] ? planet.laws[0].pid : '',\r\n    mayor: capTeam && capTeam.m[0] || '',\r\n    crisis: best(crisisBest),\r\n    wonder: wonderBy,\r\n    holiday: planet.holiday && planet.holiday.by || '',\r\n    like: best(likes),\r\n    strict: best(dislikes),\r\n    fast: best(firsts),\r\n    word: longest ? longest.pid : '',\r\n    dust: best(total)\r\n  };\r\n  const out = {};\r\n  const used = {};\r\n  cfg.titles.forEach((t, idx) => {\r\n    const p = cand[t.k];\r\n    if (p && p in total && !out[p]) { out[p] = idx; used[idx] = 1; }\r\n  });\r\n  const rest = shuffle_(cfg.titles.map((t, idx) => idx).filter(idx => cfg.titles[idx].k === 'інше' || cfg.titles[idx].k === 'other'));\r\n  let r = 0;\r\n  pids.forEach(p => { if (!(p in out) && rest.length) out[p] = rest[r++ % rest.length]; });\r\n  const top = Object.keys(total).sort((a, b) => total[b] - total[a]).slice(0, 3);\r\n  return { t: out, total, top };\r\n}\r\n\r\n/* ================= ЖУРНАЛИ В ТАБЛИЦІ ================= */\r\nfunction writeLogs_(st, cfg, all, planet, dust, awards) {\r\n  const ss = ss_();\r\n  const g = st.gameId;\r\n  const name = pid => (st.players[pid] || {}).n || '—';\r\n  const cardName = (type, id) => { const c = cfg.cards[type].filter(x => x.id === id)[0]; return c ? c.e + ' ' + c.n : ''; };\r\n  // Гравці\r\n  const pl = st.order.filter(p => st.players[p]).map(p => {\r\n    const r = roleOf_(st, cfg, p);\r\n    const t = cfg.titles[awards.t[p]];\r\n    return [g, name(p), r ? CONTINENTS[+r.team.id.slice(1)].n : '', r && r.role ? r.role.n : '', awards.total[p] || 0, t ? t.e + ' ' + t.n : ''];\r\n  });\r\n  replaceRows_(ss.getSheetByName(SH.players), g, pl);\r\n  // Внески\r\n  const rows = [];\r\n  const label = { land: 'Ландшафт', name: 'Назва планети', cities: 'Місто', laws: 'Закон', crisis: 'Кристали на кризу', power: 'Суперсила / свято', contact: 'Слово в посланні' };\r\n  Object.keys(label).forEach(stg => {\r\n    const m = (subsFor_(all, stg).input) || {};\r\n    Object.keys(m).forEach(p => {\r\n      if (!st.players[p]) return;\r\n      let v = m[p].v;\r\n      if (stg === 'land') v = cardName('land', v);\r\n      else if (stg === 'laws') v = (cfg.settings.lawStarts[v.p] || '') + ' ' + v.t;\r\n      else if (stg === 'crisis') v = v.join(' / ');\r\n      else if (stg === 'power') v = cardName('power', v.p) + ' | свято: ' + (v.h || '');\r\n      else if (stg === 'cities') { const r = roleOf_(st, cfg, p); v = (r && r.role ? r.role.n + ': ' : '') + v; }\r\n      rows.push([g, label[stg], name(p), String(v), new Date(m[p].t)]);\r\n    });\r\n  });\r\n  replaceRows_(ss.getSheetByName(SH.contrib), g, rows);\r\n  // Паспорт планети\r\n  const c = cfg.crises[planet.crisis ? planet.crisis.i : -1];\r\n  const pass = [[g, planet.name || '', cardName('land', planet.wonder),\r\n    (planet.lands || []).map(l => cardName('land', l.id)).join(', '),\r\n    (planet.cities || []).map(x => x.name + (x.id === planet.capital ? ' (столиця)' : '')).join(', '),\r\n    (planet.laws || []).map((l, i) => (i + 1) + '. ' + (cfg.settings.lawStarts[l.p] || '') + ' ' + l.t).join('\\n'),\r\n    c ? c.n + ' → ' + (c.opts[planet.crisis.win] || {}).t : '',\r\n    cardName('power', planet.power),\r\n    planet.holiday ? planet.holiday.t : '',\r\n    (planet.message || []).map(m => m.w).join(' ')\r\n  ]];\r\n  replaceRows_(ss.getSheetByName(SH.passport), g, pass);\r\n}\r\n/* Замінює рядки цієї гри (щоб повторний запис не дублював) */\r\nfunction replaceRows_(sh, gameId, rows) {\r\n  if (!sh) return;\r\n  const last = sh.getLastRow();\r\n  if (last > 1) {\r\n    const ids = sh.getRange(2, 1, last - 1, 1).getDisplayValues().map(r => r[0]);\r\n    for (let i = ids.length - 1; i >= 0; i--) if (ids[i] === gameId) sh.deleteRow(i + 2);\r\n  }\r\n  if (rows.length) sh.getRange(sh.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows).setFontFamily(FONT);\r\n}\r\n\r\nfunction shuffle_(a) {\r\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }\r\n  return a;\r\n}\r\n\r\n/* ================= ОФОРМЛЕННЯ ТАБЛИЦІ ================= */\r\nconst STYLE = { night: '#0B1026', text: '#1B1F3B', band: '#F4F1FF', line: '#8B5CF6', soft: '#E9E4FF', accent: '#6D28D9' };\r\n// Для кожного аркуша: які колонки по центру, жирні, виділені (номери колонок з 1) і ширина\r\nconst SHEET_STYLE = {\r\n  'Налаштування': { accent: [1], widths: [330, 520] },\r\n  'Етапи': { center: [1, 3, 4, 5], accent: [2], widths: [90, 190, 70, 120, 140, 330, 330] },\r\n  'Репліки КОМПИ': { center: [1], accent: [1], widths: [140, 560, 420] },\r\n  'Картки': { center: [1, 2, 3, 6], accent: [4], widths: [120, 70, 70, 230, 330, 100, 330, 380] },\r\n  'Кризи': { center: [1, 2], accent: [3], widths: [50, 60, 230, 330, 200, 300, 200, 300, 200, 300, 200, 300] },\r\n  'Звання': { center: [1, 2], accent: [3], widths: [100, 70, 300, 360] },\r\n  'Гравці': { center: [1, 5], accent: [2], widths: [150, 180, 220, 180, 120, 300] },\r\n  'Внески': { center: [1, 2], accent: [3], widths: [150, 170, 180, 460, 150] },\r\n  'Паспорт планети': { center: [1], accent: [2], widths: [150, 190, 220, 300, 300, 420, 300, 220, 220, 360] }\r\n};\r\n\r\n/* Оформлює один аркуш: Unbounded, нічна шапка з фіолетовою лінією, смуги рядків */\r\nfunction styleSheet_(sh) {\r\n  const n = Math.max(1, sh.getLastColumn());\r\n  if (sh.getMaxColumns() > n) sh.deleteColumns(n + 1, sh.getMaxColumns() - n);\r\n  const rows = sh.getMaxRows();\r\n  const all = sh.getRange(1, 1, rows, n);\r\n  all.setFontFamily(FONT).setFontSize(9).setFontColor(STYLE.text).setVerticalAlignment('middle').setWrap(true);\r\n  sh.getRange(1, 1, 1, n).setBackground(STYLE.night).setFontColor('#FFFFFF').setFontWeight('bold').setHorizontalAlignment('center')\r\n    .setBorder(null, null, true, null, null, null, STYLE.line, SpreadsheetApp.BorderStyle.SOLID_THICK);\r\n  sh.setRowHeight(1, 44);\r\n  sh.setFrozenRows(1);\r\n  sh.getBandings().forEach(b => b.remove());\r\n  all.applyRowBanding(SpreadsheetApp.BandingTheme.LIGHT_GREY, true, false)\r\n    .setHeaderRowColor(STYLE.night).setFirstRowColor('#FFFFFF').setSecondRowColor(STYLE.band);\r\n  if (rows > 1) sh.getRange(2, 1, rows - 1, n).setBorder(null, null, null, null, null, true, STYLE.soft, SpreadsheetApp.BorderStyle.SOLID);\r\n  const cfg = SHEET_STYLE[sh.getName()] || {};\r\n  const col = c => sh.getRange(2, c, Math.max(1, rows - 1), 1);\r\n  (cfg.center || []).forEach(c => c \u003c= n && col(c).setHorizontalAlignment('center'));\r\n  (cfg.bold || []).forEach(c => c \u003c= n && col(c).setFontWeight('bold'));\r\n  (cfg.accent || []).forEach(c => c \u003c= n && col(c).setFontWeight('bold').setFontColor(STYLE.accent));\r\n  (cfg.widths || []).forEach((w, i) => { if (i \u003c n) sh.setColumnWidth(i + 1, w); });\r\n  if (sh.getName() === SH.cards) {\r\n    const dv = SpreadsheetApp.newDataValidation().requireValueInList(['ландшафт', 'роль', 'модифікатор', 'суперсила'], true).setAllowInvalid(false).build();\r\n    col(1).setDataValidation(dv);\r\n    // Колонка «Колір» підсвічується своїм кольором\r\n    const last = sh.getLastRow();\r\n    if (last > 1) {\r\n      const vals = sh.getRange(2, 6, last - 1, 1).getValues();\r\n      sh.getRange(2, 6, last - 1, 1).setBackgrounds(vals.map(r => [/^#[0-9a-f]{6}$/i.test(String(r[0])) ? String(r[0]) : null]));\r\n    }\r\n  }\r\n}\r\n\r\n/* Оформлює всі аркуші й ставить Unbounded як шрифт таблиці */\r\nfunction styleAllSheets_() {\r\n  const ss = ss_();\r\n  try { ss.getSpreadsheetTheme().setFontFamily(FONT); } catch (err) { /* тему змінити не вдалося — шрифт уже стоїть у клітинках */ }\r\n  let n = 0;\r\n  Object.keys(SH).forEach(k => { const sh = ss.getSheetByName(SH[k]); if (sh) { styleSheet_(sh); n++; } });\r\n  props_().setProperty('STYLE_V', STYLE_VERSION);\r\n  return n;\r\n}\r\n/* Сайт сам оформлює таблицю один раз після оновлення коду */\r\nfunction ensureStyle_() {\r\n  if (props_().getProperty('STYLE_V') === STYLE_VERSION) return;\r\n  try { withLock_(() => { if (props_().getProperty('STYLE_V') !== STYLE_VERSION) styleAllSheets_(); }); }\r\n  catch (err) { console.error('Оформлення не вдалося: ' + err); }\r\n}\r\nfunction styleSheetsMenu() {\r\n  const n = styleAllSheets_();\r\n  SpreadsheetApp.getActive().toast('Готово: оформлено аркушів — ' + n + ', шрифт ' + FONT + '.', MENU, 5);\r\n}\r\n\r\n/* ================= СТВОРЕННЯ АРКУШІВ З ШАБЛОНОМ ================= */\r\nfunction setupSheets_() {\r\n  const ss = ss_();\r\n  const seed = SEED_();\r\n  let made = 0;\r\n  Object.keys(SH).forEach(k => {\r\n    const name = SH[k];\r\n    if (ss.getSheetByName(name)) return;\r\n    const sh = ss.insertSheet(name);\r\n    const data = seed[name];\r\n    sh.getRange(1, 1, data.length, data[0].length).setValues(data);\r\n    made++;\r\n  });\r\n  if (made) {\r\n    // Порожній аркуш, який Google створює в новій таблиці, прибираємо (лише якщо в ньому нічого немає)\r\n    ss.getSheets().forEach(sh => { if (/^(Аркуш|Sheet|Лист)\\s?1$/.test(sh.getName()) && sh.getLastRow() === 0) ss.deleteSheet(sh); });\r\n    ss.setActiveSheet(ss.getSheetByName(SH.settings));\r\n    CacheService.getScriptCache().remove('CFG');\r\n  }\r\n  return made;\r\n}\r\n\r\n/* Шаблон даних: усе можна змінити прямо в таблиці */\r\nfunction SEED_() {\r\n  return {\r\n    'Налаштування': [\r\n      ['Параметр', 'Значення'],\r\n      ['Назва гри', 'Космос у кишені'],\r\n      ['PIN ведучого', '2026'],\r\n      ['Назва планети, якщо ніхто не придумав', 'Кишенькова планета'],\r\n      ['Законів у Конституції', 5],\r\n      ['Номер кризи (порожньо = випадкова)', ''],\r\n      ['Початки законів (через ;)', \"Кожен мешканець зобов'язаний;Кожен мешканець має право;На планеті суворо заборонено\"],\r\n      ['Музика заставки', ''],\r\n      ['Музика гри', ''],\r\n      ['Музика фіналу', ''],\r\n      ['Гучність музики (0–100)', 40],\r\n      ['Космічний звук, якщо немає музики (так/ні)', 'так']\r\n    ],\r\n    'Етапи': [\r\n      ['Ключ', 'Етап', 'Емодзі', 'Хвилин на завдання', 'Хвилин на голосування', 'Завдання на телефоні', 'Голосування на телефоні'],\r\n      ['lobby', 'Посадка', '🛸', 0, 0, 'Введи ім\\'я і збери свого прибульця', ''],\r\n      ['intro', 'Легенда', '📡', 0, 0, 'Дивись на великий екран 👀', ''],\r\n      ['land', 'Ландшафт', '🏔️', 1.5, 1.5, 'Обери одну з трьох карток природи й кинь її на планету', 'Що стане Дивом планети? Обери одне'],\r\n      ['name', 'Ім\\'я планети', '🏷️', 1.5, 1, 'Придумай назву для планети. Немає ідей — тисни 🎲', 'Голосуй за найкращу назву (за свою не можна)'],\r\n      ['cities', 'Міста', '🏙️', 3, 1, 'Дай відповідь на питання своєї ролі. Не забудь про особливість від Колеса!', 'Куди б ти переїхав(-ла)? Обери місто (не своє)'],\r\n      ['laws', 'Конституція', '⚖️', 2, 2, 'Напиши один закон для планети', 'Гортай закони: 👍 приймаємо, 👎 ні'],\r\n      ['crisis', 'Криза', '☄️', 1.5, 0, 'Розподіли 10 кристалів між способами порятунку', ''],\r\n      ['power', 'Суперсила і свято', '✨', 2, 1, 'Обери суперсилу мешканців і придумай головне свято планети', 'Голосуй за головне свято (за своє не можна)'],\r\n      ['contact', 'Перший контакт', '👽', 1, 0, 'Додай РІВНО ОДНЕ слово до послання Всесвіту', ''],\r\n      ['final', 'Паспорт планети', '🪪', 0, 0, 'Твоя посвідка мешканця вже тут ⬇', '']\r\n    ],\r\n    'Репліки КОМПИ': [\r\n      ['Крок', 'Що каже КОМПА (на екрані; « | » ділить на кілька бульбашок)', 'Підказка ведучому'],\r\n      ['lobby.join', 'Біп-буп! Я — КОМПА, бортовий інтелект Галактичного реєстру планет. | Скануйте QR-код і с завжди. Ну, до кінця віклі.', 'Поясніть: у кожного континенту буде своє місто, а кожна роль відповідає на своє питання. Головне — Мер, бо він придумує назву міста.'],\r\n      ['cities.wheel', 'Колесо Долі вирішує, з якою особливістю житиме кожне місто. | Скарги приймаються лише у вигляді пісні.', 'Колесо крутиться саме. Після кожного результату прокоментуйте: «Бідний Пурпурний континент…»'],\r\n      ['cities.input', 'Будуємо міста! | Кожен відповідає на питання своєї ролі. Особливість від Колеса — обов\\'язкова. | Я перевірю. Ну, спробую.', 'Нагадайте: можна радитися з командою в чаті Google Meet. Хто не має ідей — кнопка 🎲.'],\r\n      ['cities.vote', 'Міста збудовано! | Чесне питання: куди б ви переїхали? За свій континент голосувати не можна — це занадто патріотично.', 'Пройдіться по картках міст на екрані й зачитайте найкумедніші відповіді.'],\r\n      ['cities.reveal', 'Маємо СТОЛИЦЮ! | Ціни на нерухомість щойно зросли в тисячу разів.', 'Мер столиці може сказати коротку промову (10 секунд, не більше!).'],\r\n      ['laws.input', 'Кожна цивілізація потребує законів. | Напишіть один закон для планети. Серйозний або ні. Краще ні.', 'Підкажіть приклад: «Кожен мешканець має право на дрімоту після обіду».'],\r\n      ['laws.vote', 'Голосуємо за закони! | 👍 — приймаємо. 👎 — це вже занадто навіть для нас.', 'На екрані видно, скільки законів кожен уже оцінив. Підганяйте тих, хто відстає.'],\r\n      ['laws.reveal', 'Конституцію ухвалено! | Порушників чекає суворе покарання: прослухати мій плейлист повністю.', 'Зачитайте Конституцію урочисто. Можна попросити всіх підняти праву руку й «присягнути».'],\r\n      ['crisis.alarm', 'ТРИВОГА! ТРИВОГА! | Це не навчання! Ну… трохи навчання.', 'Грайте паніку! Зачитайте опис кризи драматичним голосом.'],\r\n      ['crisis.input', 'У кожного 10 кристалів енергії. | Розподіліть їх між способами порятунку. Можна все в один. Не можна сховатися під стіл.', 'Стовпчики на екрані ростуть наживо — коментуйте, який варіант лідирує.'],\r\n     static now() { return RealDate.now() + off; }
  }

  /* ---------- Стан гри = хід гри від ведучого + гравці, що зайшли самі ---------- */
  let F = null;
  function mergedState() {
    let st = null;
    try { st = JSON.parse(M.props.STATE || 'null'); } catch (e) {}
    if (!st) st = { gameId: '', i: 0, stepAt: 0, timer: { end: 0, total: 0, paused: false, left: 0 }, teams: [], crisis: -1, powerOpts: [] };
    const pls = Object.keys(M.pl).map(k => { try { return Object.assign({ pid: k }, JSON.parse(M.pl[k])); } catch (e) { return null; } })
      .filter(p => p && p.n).sort((a, b) => (a.t || 0) - (b.t || 0) || (a.pid < b.pid ? -1 : 1));
    st.players = {}; st.order = [];
    pls.forEach(p => { st.players[p.pid] = { n: p.n, a: p.a || {} }; st.order.push(p.pid); });
    st.teams = st.teams || [];
    if (st.teams.length) {
      st.teams.forEach(t => { t.m = (t.m || []).filter(x => st.players[x]); });
      st.order.forEach(pid => F.placeInTeam_(st, pid)); // хто зайшов пізніше — на найменший континент
    }
    return st;
  }

  /* ---------- Записи, зібрані за одну дію; надсилаються в базу одним пакетом ---------- */
  let pending = null;
  const put = (path, val) => { if (pending) pending[path] = val; };
  const isSub = k => k.indexOf('S|') === 0;
  const PropsShim = {
    getProperty: k => k === 'STATE' ? JSON.stringify(mergedState()) : isSub(k) ? (M.s[k] === undefined ? null : M.s[k]) : (M.props[k] === undefined ? null : M.props[k]),
    setProperty: (k, v) => {
      v = String(v);
      if (isSub(k)) { M.s[k] = v; put(ROOT + '/s/' + k, v); return; }
      if (k === 'STATE') { const o = JSON.parse(v); delete o.players; delete o.order; v = JSON.stringify(o); } // гравці живуть окремо
      M.props[k] = v; put(ROOT + '/props/' + k, v);
    },
    deleteProperty: k => {
      if (isSub(k)) { delete M.s[k]; put(ROOT + '/s/' + k, null); }
      else { delete M.props[k]; put(ROOT + '/props/' + k, null); }
    },
    getProperties: () => Object.assign({}, M.props, M.s, { STATE: JSON.stringify(mergedState()) })
  };
  const SVC = {
    PropertiesService: { getScriptProperties: () => PropsShim },
    CacheService: { getScriptCache: () => ({ get: k => k === 'VER' ? String(M.ver) : null, put() {}, remove() {}, getAll: () => ({}) }) },
    LockService: { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) },
    Utilities: {
      formatDate: d => {
        const p = {};
        new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kyiv', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
          .formatToParts(d).forEach(x => { p[x.type] = x.value; });
        return p.year + '-' + p.month + '-' + p.day + ' ' + (p.hour === '24' ? '00' : p.hour) + ':' + p.minute;
      }
    },
    Date: SDate,
    getConfig_: () => window.__CFG,
    checkPin_: () => HOST,
    // результати гри записуємо в таблицю через Apps Script у фоні
    writeLogs_: (st, cfg, all, planet, dust, awards) => { rpc('writeLogsFrom', [PIN, st, all, planet, dust, awards], 120000).catch(e => console.warn('Журнал', e)); }
  };
  F = new Function('SVC', 'const { PropertiesService, CacheService, LockService, Utilities, Date } = SVC;\n' + ENGINE_SRC +
    '\n;getConfig_ = SVC.getConfig_; checkPin_ = SVC.checkPin_; writeLogs_ = SVC.writeLogs_;\n' +
    'return { getState, submit, hostAction, freshState_, placeInTeam_ };')(SVC);

  function flush() {
    const up = pending; pending = null;
    if (!up || !Object.keys(up).length) return Promise.resolve();
    nudge();
    return db.ref().update(up).catch(e => {
      console.warn('Firebase', e);
      if (typeof toast === 'function') toast('⚠️ Не записалось: ' + (e && e.message || e));
      throw e;
    });
  }

  /* ---------- Дії, які викликає сторінка гри ---------- */
  const ACT = {
    getState: ver => F.getState(ver),
    submit(pid, stage, step, value) {
      pending = {};
      const r = F.submit(uid, stage, step, value);
      return flush().then(() => r, () => ({ ok: false }));
    },
    joinGame(pid, name, alien) {
      name = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!name) throw new Error('Введіть ім\'я');
      const a = {};
      ['b', 'c', 'y', 'm', 'x'].forEach(k => { a[k] = Math.max(0, Math.min(20, parseInt((alien || {})[k], 10) || 0)); });
      let old = null; try { old = JSON.parse(M.pl[uid] || 'null'); } catch (e) {}
      const v = JSON.stringify({ n: name, a, t: old && old.t ? old.t : SDate.now() });
      M.pl[uid] = v; nudge();
      return db.ref(ROOT + '/pl/' + uid).set(v).then(() => ({ ok: true }));
    },
    async hostLogin(pin) {
      pin = String(pin || '').trim();
      const ref = db.ref('hosts/' + uid);
      try { await ref.set(pin); }
      catch (e) {
        try { if (/^\d+$/.test(pin)) await ref.set(Number(pin)); else return false; }
        catch (e2) { return false; }
      }
      HOST = true; PIN = pin;
      if (!M.props.STATE) { pending = {}; PropsShim.setProperty('STATE', JSON.stringify(F.freshState_())); await flush(); }
      // свіжі налаштування з таблиці — для всіх учасників
      rpc('config', ['pult']).then(c => { if (c) { publishCfg(c); } }).catch(() => {});
      return true;
    },
    async hostAction(pin, action, p) {
      if (!HOST) throw new Error('Неправильний PIN');
      if (action === 'reset') {
        let vol; try { vol = JSON.parse(M.props.STATE || '{}').vol; } catch (e) {}
        const fresh = F.freshState_(); if (vol != null) fresh.vol = vol;
        M.props = { STATE: JSON.stringify(fresh) }; M.s = {}; M.pl = {}; nudge();
        await db.ref().update({ [ROOT + '/props']: { STATE: JSON.stringify(fresh) }, [ROOT + '/s']: null, [ROOT + '/pl']: null });
        return { ok: true };
      }
      if (action === 'reload') {
        const c = await rpc('config', ['pult']);
        publishCfg(c);
        return { ok: true };
      }
      pending = {};
      const r = F.hostAction(pin, action, p || {});
      if (action === 'kick' && p && p.pid) { delete M.pl[p.pid]; put(ROOT + '/pl/' + p.pid, null); }
      await flush();
      return r;
    },
    getMusic: (slot, part) => rpc('getMusic', [slot, part], 60000)
  };
  /* Налаштування з таблиці: оновлюємо в цій вкладці й кладемо в базу, щоб у всіх відкривалось швидко */
  function publishCfg(c) {
    const keep = { mode: window.__CFG.mode, url: window.__CFG.url };
    const clean = JSON.parse(JSON.stringify(c)); delete clean.mode; delete clean.url;
    Object.keys(window.__CFG).forEach(k => { delete window.__CFG[k]; });
    Object.assign(window.__CFG, clean, keep);
    if (clean.title) document.title = clean.title;
    db.ref(ROOT + '/cfg').set(JSON.stringify(clean)).catch(() => {});
  }

  /* ---------- Той самий google.script.run, що в Apps Script ---------- */
  window.google = { script: { get run() {
    let ok = () => {}, fail = () => {};
    const p = new Proxy({}, { get(_, k) {
      if (k === 'withSuccessHandler') return f => { ok = f; return p; };
      if (k === 'withFailureHandler') return f => { fail = f; return p; };
      return (...a) => { Promise.resolve().then(() => { if (!ACT[k]) throw new Error('Невідома дія'); return ACT[k].apply(null, a); }).then(r => ok(r), e => fail(e)); };
    } });
    return p;
  } } };

  /* ---------- Запуск ---------- */
  function watch(path, key) {
    return new Promise(res => {
      db.ref(path).on('value', s => { M[key] = s.val() || {}; nudge(); res(); }, () => res());
    });
  }
  async function loadCfg() {
    try {
      const v = await Promise.race([db.ref(ROOT + '/cfg').once('value'), sleep(6000).then(() => null)]);
      if (v && v.val()) return JSON.parse(v.val());
    } catch (e) {}
    return rpc('config', [MODE]);
  }
  async function start(attempt) {
    try {
      if (!db) {
        firebase.initializeApp(FB);
        const cred = await firebase.auth().signInAnonymously();
        uid = cred.user.uid;
        window.__UID = uid;
        db = firebase.database();
        db.ref('.info/serverTimeOffset').on('value', s => { off = s.val() || 0; });
      }
      const c = await loadCfg();
      c.mode = MODE;
      c.url = location.origin + location.pathname; // QR-код веде на цей сайт
      window.__CFG = c;
      if (c.title) document.title = c.title;
      await Promise.race([Promise.all([watch(ROOT + '/props', 'props'), watch(ROOT + '/pl', 'pl'), watch(ROOT + '/s', 's')]), sleep(8000)]);
      const boot = document.getElementById('boot'); if (boot) boot.remove();
      const s = document.createElement('script');
      s.textContent = GAME + '\nwindow.__started = true;';
      document.body.appendChild(s);
    } catch (e) {
      console.warn(e);
      status('Не вдалося з\'єднатися з грою. Пробуємо ще раз…');
      setTimeout(() => start(attempt + 1), Math.min(10000, 2000 * (attempt + 1)));
    }
  }
  start(0);
})();

</script>
