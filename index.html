<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Космос у кишені</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🪐%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#05061A; --ink:#EEF0FF; --mut:#9AA3D0; --vio:#8B5CF6; --vio2:#B57CFF; --cy:#2EE6C8; --pink:#FF6FB5; --or:#FF9A4D; --yel:#FFD23F; --red:#FF4D6D;
  --card:rgba(22,24,64,.74); --card2:rgba(36,38,92,.8); --line:rgba(139,92,246,.38); --r:18px;
  --emo:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji'; --hf:'Unbounded',system-ui,sans-serif,var(--emo); --bf:'Unbounded',system-ui,sans-serif,var(--emo);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(ellipse at 20% 10%,#1a1350 0%,transparent 50%),radial-gradient(ellipse at 85% 80%,#0d2a4a 0%,transparent 55%),radial-gradient(ellipse at 60% 40%,#2a0f3d 0%,transparent 45%),var(--bg);
  color:var(--ink);font-family:var(--bf);overflow-x:hidden;min-height:100vh}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.layer{position:relative;z-index:1}
h1,h2,h3,.hf{font-family:var(--hf);letter-spacing:.01em}
button{font-family:var(--hf);cursor:pointer;border:0}
input,textarea{font-family:var(--bf)}
.hidden{display:none!important}
.btn{background:linear-gradient(135deg,var(--vio),#6D28D9);color:#fff;border-radius:14px;padding:14px 18px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(139,92,246,.35);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn.cy{background:linear-gradient(135deg,#2EE6C8,#14A3A3);color:#03141a}
.btn.pink{background:linear-gradient(135deg,#FF6FB5,#D63384)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:12px;border-radius:11px}
.btn.wide{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(8px)}
.mut{color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(139,92,246,.18);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#1d1f4f;border:1px solid var(--vio);color:#fff;padding:12px 18px;border-radius:14px;z-index:99;transition:transform .3s;font-weight:700;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.fadeUp{animation:fadeUp .5s ease both}

/* ---------- ТЕЛЕФОН ГРАВЦЯ ---------- */
.ph{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.ph-top{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
.ph-top .nm{font-family:var(--hf);font-size:14px;font-weight:600}
.ph-top .dust{margin-left:auto;font-family:var(--hf);font-size:13px;color:var(--yel)}
.ph-stage{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:8px}
.tbar{height:6px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vio));transition:width .25s linear}
.tbar.low i{background:linear-gradient(90deg,var(--or),var(--red))}
.task{font-family:var(--hf);font-size:17px;line-height:1.35;margin:4px 0 14px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;width:100%;text-align:left;color:var(--ink);font-family:var(--bf);font-size:15px;font-weight:700;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt .em{font-size:30px;line-height:1;flex:0 0 auto}
.opt small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:2px}
.opt.sel{border-color:var(--cy);background:rgba(46,230,200,.13);box-shadow:0 0 0 3px rgba(46,230,200,.18)}
.opt.dis{opacity:.4;pointer-events:none}
.field{width:100%;background:rgba(255,255,255,.06);border:2px solid var(--line);border-radius:14px;color:#fff;padding:14px;font-size:16px;outline:none}
.field:focus{border-color:var(--cy)}
textarea.field{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:rgba(255,255,255,.07);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:12.5px;font-weight:700;font-family:var(--bf)}
.chip.sel{border-color:var(--cy);background:rgba(46,230,200,.15)}
.done{text-align:center;padding:22px 14px}
.done .big{font-size:54px;margin-bottom:8px}
.done h3{font-size:17px;margin-bottom:8px}
.builder{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0 14px}
.bl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:6px 8px}
.bl span{flex:1;text-align:center;font-weight:700;font-size:13px}
.bl button{width:40px;height:36px;border-radius:10px;background:rgba(139,92,246,.3);color:#fff;font-size:16px}
.alien-prev{display:flex;justify-content:center;animation:floaty 3s ease-in-out infinite}
.lawcard{min-height:190px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:18px;line-height:1.45;font-weight:700}
.lawcard .pre{color:var(--cy);font-family:var(--hf);font-size:13px;margin-bottom:8px}
.vbtns{display:flex;gap:12px;margin-top:12px}
.vbtns button{flex:1;font-size:30px;padding:14px;border-radius:16px;color:#fff}
.vb-no{background:linear-gradient(135deg,#FF4D6D,#B0234A)}
.vb-yes{background:linear-gradient(135deg,#2EE6C8,#159A86)}
.crys{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px}
.crys .t{flex:1;font-weight:700;font-size:14px}
.crys .n{font-family:var(--hf);font-size:18px;width:34px;text-align:center;color:var(--cy)}
.crys button{width:40px;height:40px;border-radius:12px;background:rgba(139,92,246,.35);color:#fff;font-size:20px}
.left-c{text-align:center;font-family:var(--hf);margin:8px 0 12px;font-size:15px}
.bubble{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(46,230,200,.12));border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:12px}
.teamc{border-radius:16px;padding:14px;border:2px solid;margin-bottom:12px;background:rgba(0,0,0,.25)}
.teamc h3{font-size:16px;margin-bottom:6px}
.mates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mates .tag{font-size:11.5px}
.cert{background:linear-gradient(160deg,#151a4d,#2a1250 60%,#0c2a3e);border:2px solid rgba(255,210,63,.55);border-radius:22px;padding:22px 18px;text-align:center;position:relative;overflow:hidden}
.cert .k{font-family:var(--hf);font-size:10.5px;letter-spacing:.18em;color:var(--yel)}
.cert h2{font-size:20px;margin:6px 0 2px}
.cert .title{font-family:var(--hf);font-size:17px;color:var(--cy);margin-top:10px}
.cert .stamp{position:absolute;right:12px;top:12px;width:64px;height:64px;opacity:.8;border:3px solid rgba(255,77,109,.7);border-radius:50%;color:rgba(255,77,109,.85);font-family:var(--hf);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-16deg);line-height:1.25}

/* ---------- ВЕЛИКИЙ ЕКРАН ---------- */
.scr{height:100vh;display:grid;grid-template-rows:auto 1fr;padding:18px 26px;gap:12px;overflow:hidden}
.s-top{display:flex;align-items:center;gap:18px}
.s-logo{font-family:var(--hf);font-weight:800;font-size:20px;white-space:nowrap}
.s-logo b{background:linear-gradient(90deg,var(--cy),var(--vio2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.s-prog{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.s-prog span{font-size:11px;padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.05);color:var(--mut);font-weight:700;border:1px solid transparent;white-space:nowrap}
.s-prog span.on{background:rgba(139,92,246,.3);color:#fff;border-color:var(--vio)}
.s-prog span.past{color:#c9cdf0}
.s-timer{width:84px;height:84px;position:relative;flex:0 0 auto}
.s-timer svg{transform:rotate(-90deg)}
.s-timer .tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-size:19px}
.s-timer.low .tt{color:var(--red);animation:pulse 1s infinite}
.s-main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:26px;min-height:0}
.s-planet{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.s-planet .pl-wrap{position:relative;width:min(100%,78vh);aspect-ratio:1;animation:floaty 7s ease-in-out infinite}
.s-planet svg.pl,.s-planet svg.orb{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb .ring{animation:spin 140s linear infinite;transform-origin:300px 300px}
.orb .ali{animation:spin 140s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.s-side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.kompa{display:flex;gap:14px;align-items:flex-start}
.kompa .face{flex:0 0 auto;width:78px}
.kompa .lines{flex:1;display:flex;flex-direction:column;gap:8px}
.kb{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(46,230,200,.12));border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;font-size:clamp(14px,1.35vw,20px);line-height:1.45;font-weight:600;animation:fadeUp .4s ease both}
.kb.old{opacity:.55;font-size:clamp(12px,1.05vw,16px)}
.k-eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.k-mouth rect{transform-box:fill-box;transform-origin:center;transform:scaleY(.3)}
.talking .k-mouth rect{animation:talk .28s infinite}
.talking .k-mouth rect:nth-child(2){animation-delay:.1s}.talking .k-mouth rect:nth-child(3){animation-delay:.2s}
.s-box{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.s-box::-webkit-scrollbar{display:none}
.s-h{font-family:var(--hf);font-size:clamp(18px,1.9vw,30px);margin-bottom:10px;line-height:1.2}
.s-sub{color:var(--mut);font-size:clamp(13px,1.1vw,17px);margin-bottom:12px}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who .w{display:flex;flex-direction:column;align-items:center;width:74px;opacity:.38;transition:opacity .3s;position:relative}
.who .w.ok{opacity:1}
.who .w.ok::after{content:'✓';position:absolute;top:0;right:8px;background:var(--cy);color:#04221c;border-radius:50%;width:20px;height:20px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.who .w small{font-size:11px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.who .w .fr{font-size:10px;color:var(--cy)}
.cnt{font-family:var(--hf);font-size:clamp(26px,3vw,48px);color:var(--cy)}
.qr-card{background:#fff;border-radius:22px;padding:16px;display:inline-flex;flex-direction:column;align-items:center;gap:8px;color:#0B1026}
.qr-card b{font-family:var(--hf);font-size:13px}
.lobby{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bars .b{margin-bottom:10px}
.bars .bt{display:flex;justify-content:space-between;font-weight:700;font-size:clamp(13px,1.15vw,18px);margin-bottom:4px;gap:10px}
.bars .bb{height:14px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.bars .bb i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,1,.3,1)}
.bars .b.win .bt{color:var(--yel)}
.optlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:clamp(13px,1.15vw,18px)}
.oc .em{font-size:30px;display:block;margin-bottom:4px}
.oc small{display:block;color:var(--mut);font-weight:500;font-size:12.5px;margin-top:3px}
.oc.win{border-color:var(--yel);box-shadow:0 0 30px rgba(255,210,63,.35)}
.bigcard{text-align:center;padding:26px;border-radius:24px;background:linear-gradient(160deg,rgba(139,92,246,.35),rgba(46,230,200,.12));border:2px solid rgba(255,210,63,.6);box-shadow:0 0 60px rgba(255,210,63,.18)}
.bigcard .em{font-size:clamp(56px,7vw,110px);line-height:1}
.bigcard h2{font-size:clamp(22px,2.6vw,42px);margin:10px 0 6px}
.bigcard .k{font-family:var(--hf);letter-spacing:.2em;font-size:12px;color:var(--yel)}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.city{border-radius:18px;padding:12px 14px;border:2px solid;background:rgba(5,6,26,.55)}
.city h3{font-size:clamp(14px,1.3vw,20px);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.city .mod{font-size:12px;font-weight:700;background:rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;margin:6px 0 8px;display:inline-block}
.city .it{font-size:clamp(12px,1vw,15px);margin-bottom:6px;line-height:1.35}
.city .it b{color:var(--mut);font-weight:700}
.city .it.wait{opacity:.4}
.city.cap{box-shadow:0 0 40px rgba(255,210,63,.35);border-color:var(--yel)!important}
.city .mem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:4px}
.consti{background:linear-gradient(180deg,#f8f0dc,#ead9b4);color:#2b1d0e;border-radius:18px;padding:20px 24px;box-shadow:0 10px 50px rgba(0,0,0,.4)}
.consti h3{text-align:center;font-size:clamp(15px,1.5vw,22px);margin-bottom:12px;color:#5a2d0c}
.consti li{font-size:clamp(13px,1.2vw,19px);line-height:1.4;margin:0 0 10px 22px;font-weight:700;animation:fadeUp .6s ease both}
.consti li em{font-style:normal;color:#8a5a2b;font-weight:600;font-size:.8em}
.alarm{border:3px solid var(--red);border-radius:22px;padding:20px;background:rgba(255,77,109,.12);animation:shake .5s 3}
.alarm .em{font-size:64px}
.msg{font-family:var(--hf);font-size:clamp(20px,2.4vw,38px);line-height:1.4;text-align:center;padding:20px}
.msg span{display:inline-block;margin:0 .22em;animation:pop .5s both}
.wheelbox{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.wheel{position:relative;width:min(300px,30vw);aspect-ratio:1}
.wheel svg{width:100%;height:100%;transition:transform 4.4s cubic-bezier(.12,.7,.15,1)}
.wheel .ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--yel);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));z-index:2}
.wres{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.wres .r{border-radius:14px;padding:10px 12px;border:2px solid;font-weight:700;font-size:clamp(13px,1.15vw,17px)}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.aw{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.aw b{font-size:14px}.aw small{display:block;color:var(--cy);font-family:var(--hf);font-size:11.5px;margin-top:2px}
.sound-box{position:fixed;left:16px;bottom:14px;z-index:5;display:flex;align-items:center;gap:8px;opacity:.85;background:rgba(5,6,26,.6);border-radius:14px;padding:4px 10px 4px 4px}
.sound-box input{width:110px;accent-color:#8B5CF6}
.sound-box span{font-size:11px;min-width:34px}
.pl .surf{animation:slide 120s linear infinite}
.pl .clouds{animation:slide 70s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-760px)}}
.pl .pop{transform-box:fill-box;transform-origin:center}
.pl .smoke{animation:smoke 3.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:.85}100%{transform:translate(9px,-48px) scale(1.8);opacity:0}}
.pl .lava{animation:pulse 1.3s ease-in-out infinite}
.pl .glint{animation:pulse 2.4s ease-in-out infinite}
.pl .sig{animation:pulse 1.2s ease-in-out infinite}
.pl .fall{animation:fall .7s linear infinite}
@keyframes fall{to{stroke-dashoffset:-20}}
.pl .flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.pl .beacon{animation:pulse .9s steps(2) infinite}
.pl .bob{animation:floaty 5s ease-in-out infinite}
.pl .orbit-moon{animation:spin 48s linear infinite;transform-origin:300px 300px}
.pl .orbit-sat{animation:spin 30s linear infinite;transform-origin:300px 300px}
.pl .orbit-sat2{animation:spin 44s linear infinite reverse;transform-origin:300px 300px}
.pl .burst{animation:burst 3.3s ease-out infinite;transform-box:view-box;opacity:0}
@keyframes burst{0%{transform:scale(.1);opacity:0}12%{opacity:1}60%{transform:scale(1.15);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-deco i{position:absolute;border-radius:50%;display:block}
.bg-deco .p1{width:150px;height:150px;left:-40px;bottom:-30px;background:radial-gradient(circle at 35% 30%,#b9a6e8,#5a3f8f 60%,#24164a);opacity:.55}
.bg-deco .p2{width:70px;height:70px;right:8%;bottom:14%;background:radial-gradient(circle at 35% 30%,#d7b8f0,#7d58b8 60%,#2c1a52);opacity:.5}
.bg-deco .p3{width:110px;height:110px;left:28%;top:-46px;background:radial-gradient(circle at 40% 70%,#9d8df1,#3a2a7a 65%,#140d33);opacity:.45}
.bg-deco .neb{width:60vw;height:60vh;left:5%;top:20%;background:radial-gradient(ellipse,rgba(181,124,255,.18),transparent 65%);border-radius:50%}
.bg-deco .neb2{width:50vw;height:50vh;right:-10%;top:-10%;background:radial-gradient(ellipse,rgba(46,230,200,.10),transparent 65%);border-radius:50%}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.win{animation:pulse 2.6s ease-in-out infinite}
.vol-row{display:flex;align-items:center;gap:10px}
.vol-row input{flex:1;accent-color:#8B5CF6}
.join-hint{font-size:clamp(14px,1.3vw,20px);line-height:1.5}

/* ---------- ПАСПОРТ ПЛАНЕТИ ---------- */
.passport{background:linear-gradient(160deg,#10143f,#24104a 55%,#0a2a3c);border:2px solid rgba(255,210,63,.55);border-radius:24px;padding:22px;color:#EEF0FF;font-family:var(--bf);position:relative;overflow:hidden}
.passport .pp-k{font-family:var(--hf);font-size:11px;letter-spacing:.22em;color:var(--yel);text-align:center;margin-bottom:12px}
.pp-grid{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}
.pp-grid svg{width:170px;height:170px}
.passport h2{font-size:24px;margin-bottom:8px;color:var(--cy);padding-right:70px}
.pp-row{font-size:13.5px;margin-bottom:5px;line-height:1.35}
.pp-row b{color:var(--mut);font-weight:700}
.pp-laws{margin-top:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45}
.pp-laws ol{margin-left:18px}
.pp-msg{margin-top:10px;font-family:var(--hf);font-size:14px;text-align:center;color:var(--cy)}
.pp-found{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}
.pp-found div{display:flex;flex-direction:column;align-items:center;width:58px;font-size:9.5px;font-weight:700;text-align:center}
.pp-stamp{position:absolute;right:14px;top:30px;width:76px;height:76px;border:3px solid rgba(46,230,200,.6);border-radius:50%;color:rgba(46,230,200,.8);font-family:var(--hf);font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(14deg);line-height:1.3}

@media (max-width:560px){.pp-grid{grid-template-columns:1fr;justify-items:center}.passport{padding:18px 14px}.passport h2{padding-right:0;text-align:center}.pp-stamp{width:58px;height:58px;font-size:7px;top:44px;right:8px}}
/* ---------- ПУЛЬТ ---------- */
.pult{max-width:560px;margin:0 auto;padding:14px}
.pult h2{font-size:16px;margin-bottom:8px}
.pult .now{font-family:var(--hf);font-size:18px;margin:4px 0 10px}
.pult .say{font-size:13.5px;line-height:1.45;background:rgba(139,92,246,.15);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pult .hint{font-size:13px;line-height:1.45;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pult .grid2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin:10px 0}
.pult .tim{display:flex;gap:8px;align-items:center;margin:8px 0}
.pult .tim .tt{font-family:var(--hf);font-size:24px;flex:1}
.pult .sec{margin-top:12px}
.pl-list{display:flex;flex-wrap:wrap;gap:6px}
.pl-list .tag.ok{background:rgba(46,230,200,.18);border-color:var(--cy)}
.pl-list .tag.no{opacity:.6}
.drawer{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;overflow:auto;background:rgba(8,9,32,.96);border-left:1px solid var(--line);z-index:20;transform:translateX(100%);transition:transform .3s}
.drawer.open{transform:none}
.dr-btn{position:fixed;right:16px;bottom:14px;z-index:21}
</style>
</head>

r\n  else if (x === 6) s += '\u003cpath d=\"M33 ' + (h + 8) + 'A17 15 0 0 1 67 ' + (h + 8) + 'Z\" fill=\"#5EB8FF\"/>\u003cline x1=\"50\" y1=\"' + (h - 6) + '\" x2=\"50\" y2=\"' + (h + 1) + '\" stroke=\"#333\" stroke-width=\"2\"/>\u003cellipse cx=\"50\" cy=\"' + (h - 7) + '\" rx=\"13\" ry=\"2.6\" fill=\"#FF4D6D\"/>';\r\n  return s;\r\n}\r\nfunction alienSVG(a, sz) { return '\u003csvg viewBox=\"0 -14 100 114\" width=\"' + sz + '\" height=\"' + sz + '\">' + alienG(a) + '\u003c/svg>'; }\r\nfunction randAlien() { return { b: Math.floor(Math.random() * 5), c: Math.floor(Math.random() * 10), y: Math.floor(Math.random() * 4), m: Math.floor(Math.random() * 5), x: Math.floor(Math.random() * 7) }; }\r\n\r\n/* Бортовий ШІ КОМПА */\r\nfunction kompaSVG() {\r\n  return '\u003csvg viewBox=\"0 0 100 110\" width=\"78\" height=\"86\">\u003cline x1=\"50\" y1=\"14\" x2=\"50\" y2=\"2\" stroke=\"#9AA3D0\" stroke-width=\"3\"/>\u003ccircle cx=\"50\" cy=\"4\" r=\"5\" fill=\"#2EE6C8\" style=\"animation:pulse 1.2s infinite\"/>'\r\n    + '\u003crect x=\"8\" y=\"14\" width=\"84\" height=\"70\" rx=\"22\" fill=\"#2a2d6e\" stroke=\"#8B5CF6\" stroke-width=\"3\"/>\u003crect x=\"18\" y=\"24\" width=\"64\" height=\"48\" rx=\"14\" fill=\"#0b0f2e\"/>'\r\n    + '\u003crect class=\"k-eye\" x=\"31\" y=\"34\" width=\"11\" height=\"15\" rx=\"5\" fill=\"#2EE6C8\"/>\u003crect class=\"k-eye\" x=\"58\" y=\"34\" width=\"11\" height=\"15\" rx=\"5\" fill=\"#2EE6C8\"/>'\r\n    + '\u003cg class=\"k-mouth\">\u003crect x=\"36\" y=\"56\" width=\"6\" height=\"9\" rx=\"3\" fill=\"#FF6FB5\"/>\u003crect x=\"47\" y=\"56\" width=\"6\" height=\"9\" rx=\"3\" fill=\"#FF6FB5\"/>\u003crect x=\"58\" y=\"56\" width=\"6\" height=\"9\" rx=\"3\" fill=\"#FF6FB5\"/>\u003c/g>'\r\n    + '\u003crect x=\"0\" y=\"40\" width=\"9\" height=\"22\" rx=\"4\" fill=\"#8B5CF6\"/>\u003crect x=\"91\" y=\"40\" width=\"9\" height=\"22\" rx=\"4\" fill=\"#8B5CF6\"/>\u003crect x=\"30\" y=\"86\" width=\"40\" height=\"14\" rx=\"6\" fill=\"#2a2d6e\"/>\u003c/svg>';\r\n}\r\n\r\n/* ================= ПЛАНЕТА ================= */\r\nconst SLOTS = [[300, 300], [226, 222], [378, 226], [214, 338], [388, 350], [300, 160], [300, 420], [168, 270], [432, 280]];\r\nconst CITY_POS = [[205, 258], [395, 258], [300, 382], [300, 178]];\r\nfunction blobPath(cx, cy, r, seed) {\r\n  const R = rng(seed), n = 8, pts = [];\r\n  for (let k = 0; k \u003c n; k++) { const a = k / n * Math.PI * 2; const rr = r * (.72 + R() * .42); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }\r\n  let d = 'M' + fx(pts[0][0]) + ',' + fx(pts[0][1]);\r\n  for (let k = 0; k \u003c n; k++) {\r\n    const p0 = pts[(k - 1 + n) % n], p1 = pts[k], p2 = pts[(k + 1) % n], p3 = pts[(k + 2) % n];\r\n    d += 'C' + fx(p1[0] + (p2[0] - p0[0]) / 6) + ',' + fx(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + fx(p2[0] - (p3[0] - p1[0]) / 6) + ',' + fx(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + fx(p2[0]) + ',' + fx(p2[1]);\r\n  }\r\n  return d + 'Z';\r\n}\r\n/* Що зараз намальовано на планеті (з урахуванням відповідей, що приходять наживо).\r\n   Планета «росте» шарами: ландшафт → назва → міста й нічні вогні → мережа законів → місяць після кризи → кільце суперсили → супутники → фінальний салют */\r\nconst stepIdx = (s, t) => FLOW.findIndex(f => f[0] === s && f[1] === t);\r\nfunction planetView() {\r\n  const [stg, stp] = cur();\r\n  const v = { lands: [], wonder: P.wonder || '', cities: [], name: P.name || '', power: P.power || '', crisis: null, contact: false };\r\n  if (stg === 'land' && stp !== 'reveal') {\r\n    const t = {}; Object.keys(SUBS.input || {}).forEach(p => { const id = SUBS.input[p].v; t[id] = (t[id] || 0) + 1; });\r\n    v.lands = Object.keys(t).map(id => ({ id, n: t[id] }));\r\n    v.wonder = '';\r\n  } else v.lands = (P.lands || []).slice();\r\n  if (stg === 'cities' && stp !== 'reveal') {\r\n    v.cities = S.teams.map((t, k) => { const a = (stp === 'input' || stp === 'vote') ? ((SUBS.input || {})[t.m[0]] || {}).v : ''; return { k, name: a || '', building: true }; });\r\n  } else if (P.cities && stepIdx('cities', 'split') \u003c= S.i) v.cities = P.cities.map(c => ({ k: c.k, name: c.name, cap: c.id === P.capital }));\r\n  if (stg === 'crisis') v.crisis = stp === 'reveal' ? 'boom' : 'alarm';\r\n  if (stg === 'contact') v.contact = true;\r\n  v.lights = S.i >= stepIdx('cities', 'reveal') && v.cities.length > 0;\r\n  v.net = S.i >= stepIdx('laws', 'reveal') && (P.laws || []).length > 0;\r\n  v.moon = S.i >= stepIdx('crisis', 'reveal') && P.crisis ? (CFG.crises[P.crisis.i] || {}).e || '☄️' : '';\r\n  v.sats = S.i >= stepIdx('contact', 'reveal') && (P.message || []).length > 0;\r\n  v.final = stg === 'final';\r\n  return v;\r\n}\r\n/* Тип картки природи: вода (стає океаном), небо (летить над планетою), суша (континент) */\r\nconst WATER_RE = /море|океан|річк|озер|болот|пляж|водоспад/i, SKY_RE = /летюч|хмар/i, ICE_RE = /льод|крижан|сніг/i;\r\nconst kindOf = cd => WATER_RE.test(cd.n) ? 'water' : SKY_RE.test(cd.n) ? 'sky' : 'land';\r\nconst STRIP = 760; // ширина «розгортки» поверхні: її прокручуємо, і планета ніби обертається\r\nconst phase = sec => '-' + ((Date.now() % (sec * 1000)) / 1000).toFixed(2) + 's'; // щоб обертання не стрибало після перемальовування\r\nfunction wavyLine(y) { let d = 'M0 ' + y; for (let x = 0; x \u003c STRIP; x += 40) d += ' q20 -7 40 0'; return d; }\r\nconst r1 = v => fx(v);\r\n\r\n/* ---------- Маленькі малюнки ландшафтів ---------- */\r\nconst PAINT = {\r\n  trees(x, y, r, R, n) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c (n || 7); k++) {\r\n      const px = x + (R() - .5) * r * 1.2, py = y + (R() - .5) * r * .9, h = 11 + R() * 9;\r\n      s += '\u003cg>\u003crect x=\"' + r1(px - 1.5) + '\" y=\"' + r1(py - 2) + '\" width=\"3\" height=\"' + r1(h * .35) + '\" fill=\"#6b4226\"/>'\r\n        + '\u003cpath d=\"M' + r1(px) + ' ' + r1(py - h) + 'L' + r1(px + h * .55) + ' ' + r1(py) + 'L' + r1(px - h * .55) + ' ' + r1(py) + 'Z\" fill=\"#23803d\"/>'\r\n        + '\u003cpath d=\"M' + r1(px) + ' ' + r1(py - h * 1.3) + 'L' + r1(px + h * .42) + ' ' + r1(py - h * .45) + 'L' + r1(px - h * .42) + ' ' + r1(py - h * .45) + 'Z\" fill=\"#3fbf5e\"/>\u003c/g>';\r\n    }\r\n    return s;\r\n  },\r\n  mountains(x, y, r, R, col) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 3; k++) {\r\n      const px = x - r * .35 + k * r * .35 + (R() - .5) * 8, w = 24 + R() * 14, h = 30 + R() * 18, by = y + 10 + (k % 2) * 6;\r\n      s += '\u003cpath d=\"M' + r1(px - w) + ' ' + r1(by) + 'L' + r1(px) + ' ' + r1(by - h) + 'L' + r1(px + w) + ' ' + r1(by) + 'Z\" fill=\"' + shade(col, .72) + '\"/>'\r\n        + '\u003cpath d=\"M' + r1(px) + ' ' + r1(by - h) + 'L' + r1(px + w) + ' ' + r1(by) + 'L' + r1(px + w * .2) + ' ' + r1(by) + 'Z\" fill=\"#000\" opacity=\".18\"/>'\r\n        + '\u003cpath d=\"M' + r1(px - w * .3) + ' ' + r1(by - h * .7) + 'L' + r1(px) + ' ' + r1(by - h) + 'L' + r1(px + w * .3) + ' ' + r1(by - h * .7) + 'L' + r1(px + w * .1) + ' ' + r1(by - h * .62) + 'L' + r1(px - w * .1) + ' ' + r1(by - h * .72) + 'Z\" fill=\"#fff\" opacity=\".92\"/>';\r\n    }\r\n    return s;\r\n  },\r\n  volcano(x, y) {\r\n    let s = '\u003cpath d=\"M' + (x - 42) + ' ' + (y + 16) + 'L' + (x - 9) + ' ' + (y - 26) + 'L' + (x + 9) + ' ' + (y - 26) + 'L' + (x + 42) + ' ' + (y + 16) + 'Z\" fill=\"#6e4129\"/>'\r\n      + '\u003cpath d=\"M' + (x - 9) + ' ' + (y - 26) + 'L' + (x + 9) + ' ' + (y - 26) + 'L' + (x + 4) + ' ' + (y - 6) + 'L' + (x - 3) + ' ' + (y + 6) + 'L' + (x - 6) + ' ' + (y - 12) + 'Z\" fill=\"#ff6a2b\" class=\"lava\"/>'\r\n      + '\u003cellipse cx=\"' + x + '\" cy=\"' + (y - 26) + '\" rx=\"10\" ry=\"3.5\" fill=\"#ffd23f\" class=\"lava\"/>';\r\n    for (let k = 0; k \u003c 3; k++) s += '\u003ccircle class=\"smoke\" style=\"animation-delay:' + (k * 1.1) + 's\" cx=\"' + x + '\" cy=\"' + (y - 32) + '\" r=\"9\" fill=\"#cfc3c8\"/>';\r\n    return s;\r\n  },\r\n  crystals(x, y, r, R, col) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 5; k++) {\r\n      const px = x + (R() - .5) * r, py = y + (R() - .5) * r * .6, w = 6 + R() * 5, h = 18 + R() * 20;\r\n      s += '\u003cg class=\"glint\" style=\"animation-delay:' + r1(R() * 2) + 's\">\u003cpath d=\"M' + r1(px - w) + ' ' + r1(py) + 'L' + r1(px - w) + ' ' + r1(py - h) + 'L' + r1(px) + ' ' + r1(py - h - w) + 'L' + r1(px + w) + ' ' + r1(py - h) + 'L' + r1(px + w) + ' ' + r1(py) + 'Z\" fill=\"' + col + '\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-opacity=\".7\"/>'\r\n        + '\u003cpath d=\"M' + r1(px) + ' ' + r1(py - h - w) + 'L' + r1(px + w) + ' ' + r1(py - h) + 'L' + r1(px + w) + ' ' + r1(py) + 'L' + r1(px) + ' ' + r1(py) + 'Z\" fill=\"#fff\" opacity=\".35\"/>\u003c/g>';\r\n    }\r\n    return s;\r\n  },\r\n  mushrooms(x, y, r, R, col) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 5; k++) {\r\n      const px = x + (R() - .5) * r, py = y + (R() - .5) * r * .6, z = 8 + R() * 9;\r\n      s += '\u003crect x=\"' + r1(px - z * .2) + '\" y=\"' + r1(py - z * .9) + '\" width=\"' + r1(z * .4) + '\" height=\"' + r1(z) + '\" rx=\"2\" fill=\"#fff6e8\"/>\u003cpath d=\"M' + r1(px - z) + ' ' + r1(py - z * .8) + 'A' + r1(z) + ' ' + r1(z * .8) + ' 0 0 1 ' + r1(px + z) + ' ' + r1(py - z * .8) + 'Z\" fill=\"' + col + '\"/>\u003ccircle cx=\"' + r1(px - z * .3) + '\" cy=\"' + r1(py - z * 1.15) + '\" r=\"' + r1(z * .14) + '\" fill=\"#fff\"/>\u003ccircle cx=\"' + r1(px + z * .35) + '\" cy=\"' + r1(py - z * 1.05) + '\" r=\"' + r1(z * .11) + '\" fill=\"#fff\"/>';\r\n    }\r\n    return s;\r\n  },\r\n  cacti(x, y, r, R) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 4; k++) {\r\n      const px = x + (R() - .5) * r, py = y + (R() - .5) * r * .5, h = 18 + R() * 12;\r\n      s += '\u003cg fill=\"#2f9e55\">\u003crect x=\"' + r1(px - 3.5) + '\" y=\"' + r1(py - h) + '\" width=\"7\" height=\"' + r1(h) + '\" rx=\"3.5\"/>\u003crect x=\"' + r1(px - 11) + '\" y=\"' + r1(py - h * .7) + '\" width=\"5\" height=\"' + r1(h * .35) + '\" rx=\"2.5\"/>\u003crect x=\"' + r1(px - 11) + '\" y=\"' + r1(py - h * .4) + '\" width=\"9\" height=\"4\" rx=\"2\"/>\u003c/g>';\r\n    }\r\n    return s;\r\n  },\r\n  field(x, y, r, R) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 18; k++) { const px = x + (R() - .5) * r * 1.2, py = y + (R() - .5) * r * .7; s += '\u003ccircle cx=\"' + r1(px) + '\" cy=\"' + r1(py) + '\" r=\"3.2\" fill=\"#ffd23f\" stroke=\"#a5600a\" stroke-width=\"1\"/>'; }\r\n    return s;\r\n  },\r\n  wifi(x, y) {\r\n    let s = '\u003cellipse cx=\"' + x + '\" cy=\"' + (y + 6) + '\" rx=\"22\" ry=\"11\" fill=\"#20234a\" stroke=\"#8ea2ff\" stroke-width=\"2\"/>';\r\n    for (let k = 1; k \u003c= 3; k++) s += '\u003cpath class=\"sig\" style=\"animation-delay:' + (k * .35) + 's\" d=\"M' + (x - k * 9) + ' ' + (y - 4 - k * 2) + 'A' + (k * 11) + ' ' + (k * 11) + ' 0 0 1 ' + (x + k * 9) + ' ' + (y - 4 - k * 2) + '\" fill=\"none\" stroke=\"#7fd8ff\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\r\n    return s;\r\n  },\r\n  rainbow(x, y) {\r\n    return ['#ff5e5e', '#ff9a4d', '#ffd23f', '#6bcb77', '#5eb8ff', '#b57cff'].map((c, k) => '\u003cpath d=\"M' + (x - 34 + k * 4) + ' ' + (y + 10) + 'A' + (34 - k * 4) + ' ' + (34 - k * 4) + ' 0 0 1 ' + (x + 34 - k * 4) + ' ' + (y + 10) + '\" fill=\"none\" stroke=\"' + c + '\" stroke-width=\"4\"/>').join('')\r\n      + '\u003cpath class=\"fall\" d=\"M' + (x + 26) + ' ' + (y + 10) + 'L' + (x + 26) + ' ' + (y - 30) + '\" stroke=\"#bfefff\" stroke-width=\"5\" stroke-dasharray=\"6 6\"/>';\r\n  },\r\n  fireflies(x, y, r, R) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 9; k++) s += '\u003ccircle class=\"glint\" style=\"animation-delay:' + r1(R() * 3) + 's\" cx=\"' + r1(x + (R() - .5) * r * 1.2) + '\" cy=\"' + r1(y + (R() - .5) * r * .8) + '\" r=\"2.4\" fill=\"#fff6a8\"/>';\r\n    return s;\r\n  },\r\n  shimmer(x, y, r, R) {\r\n    let s = '';\r\n    for (let k = 0; k \u003c 6; k++) s += '\u003cpath class=\"glint\" style=\"animation-delay:' + r1(R() * 2.5) + 's\" d=\"M' + r1(x + (R() - .5) * r) + ' ' + r1(y + (R() - .5) * r * .6) + 'q6 -4 12 0\" stroke=\"#fff\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"/>';\r\n    return s;\r\n  }\r\n};\r\n/* Який малюнок підходить картці (за словами в назві) */\r\nfunction paintLand(cd, x, y, r, R) {\r\n  const n = cd.n.toLowerCase();\r\n  if (/вулкан/.test(n)) return PAINT.volcano(x, y) + PAINT.trees(x, y + 10, r * .9, R, 3);\r\n  if (/кришт|кристал/.test(n)) return PAINT.crystals(x, y, r, R, cd.c);\r\n  if (/ліс|дерев/.test(n)) return PAINT.trees(x, y, r, R, 10);\r\n  if (/гор|дедлайн/.test(n)) return PAINT.mountains(x, y, r, R, cd.c);\r\n  if (/гриб/.test(n)) return PAINT.mushrooms(x, y, r, R, '#e0457b');\r\n  if (/кактус/.test(n)) return PAINT.cacti(x, y, r, R);\r\n  if (/поле|соняш/.test(n)) return PAINT.field(x, y, r, R);\r\n  if (/wi-fi|кратер/.test(n)) return PAINT.wifi(x, y);\r\n  if (/райдуж|водоспад/.test(n)) return PAINT.rainbow(x, y);\r\n  if (/динозавр|парк/.test(n)) return PAINT.trees(x, y, r, R, 6);\r\n  if (/долин|сутін/.test(n)) return PAINT.fireflies(x, y, r, R);\r\n  if (WATER_RE.test(n)) return PAINT.shimmer(x, y, r, R);\r\n  if (ICE_RE.test(n)) return PAINT.mountains(x, y, r, R, '#dff6ff');\r\n  return PAINT.trees(x, y, r, R, 4);\r\n}\r\n/* Летючий острів з травою, деревцем і водоспадом */\r\nfunction islandG(x, y, w, R, extra, fall) {\r\n  return '\u003cpath d=\"M' + r1(x - w) + ' ' + r1(y) + 'Q' + r1(x - w * .6) + ' ' + r1(y + w * 1.1) + ' ' + r1(x) + ' ' + r1(y + w * 1.25) + 'Q' + r1(x + w * .6) + ' ' + r1(y + w * 1.1) + ' ' + r1(x + w) + ' ' + r1(y) + 'Z\" fill=\"#7a5236\"/>'\r\n    + '\u003cpath d=\"M' + r1(x - w * .7) + ' ' + r1(y + w * .3) + 'Q' + r1(x) + ' ' + r1(y + w * .7) + ' ' + r1(x + w * .6) + ' ' + r1(y + w * .25) + '\" stroke=\"#5a3a26\" stroke-width=\"3\" fill=\"none\"/>'\r\n    + '\u003cellipse cx=\"' + r1(x) + '\" cy=\"' + r1(y) + '\" rx=\"' + r1(w) + '\" ry=\"' + r1(w * .32) + '\" fill=\"#4cbf5a\"/>\u003cellipse cx=\"' + r1(x - w * .2) + '\" cy=\"' + r1(y - w * .08) + '\" rx=\"' + r1(w * .6) + '\" ry=\"' + r1(w * .16) + '\" fill=\"#7be08a\" opacity=\".7\"/>'\r\n    + (fall ? '\u003cpath class=\"fall\" d=\"M' + r1(x + w * .55) + ' ' + r1(y + 4) + 'L' + r1(x + w * .55) + ' ' + r1(y + w * 1.6) + '\" stroke=\"#9fe6ff\" stroke-width=\"4\" stroke-dasharray=\"5 5\" opacity=\".9\"/>' : '')\r\n    + PAINT.trees(x, y - 2, w * .9, R, 2) + (extra || '');\r\n}\r\n\r\nfunction planetSVG(v, pre, opts) {\r\n  opts = opts || {};\r\n  const pw = card('power', v.power);\r\n  const landIdx = id => CARDS.land.findIndex(c => c.id === id);\r\n  const lands = v.lands.filter(l => card('land', l.id)).sort((a, b) => landIdx(a.id) - landIdx(b.id)).slice(0, 9);\r\n  const alive = lands.length > 0;\r\n  const glow = pw ? pw.c : v.name ? '#8B5CF6' : alive ? '#4FC3F7' : '#56607d';\r\n  const waters = lands.filter(l => kindOf(card('land', l.id)) === 'water').sort((a, b) => b.n - a.n);\r\n  const oceanCol = waters.length ? card('land', waters[0].id).c : '#1E6FA8';\r\n  const rest = lands.filter(l => !(waters[0] && l.id === waters[0].id));\r\n  const grounds = rest.filter(l => kindOf(card('land', l.id)) !== 'sky');\r\n  const skies = rest.filter(l => kindOf(card('land', l.id)) === 'sky');\r\n  const ice = lands.some(l => ICE_RE.test(card('land', l.id).n));\r\n  const isNew = id => opts.newIds && opts.newIds.indexOf('L' + id) >= 0;\r\n  let s = '\u003csvg class=\"pl\" viewBox=\"0 0 600 600\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>'\r\n    + '\u003cradialGradient id=\"' + pre + 'rock\" cx=\"38%\" cy=\"34%\" r=\"75%\">\u003cstop offset=\"0\" stop-color=\"#7d86a8\"/>\u003cstop offset=\".55\" stop-color=\"#3b4166\"/>\u003cstop offset=\"1\" stop-color=\"#171a36\"/>\u003c/radialGradient>'\r\n    + '\u003cradialGradient id=\"' + pre + 'sea\" cx=\"38%\" cy=\"34%\" r=\"80%\">\u003cstop offset=\"0\" stop-color=\"' + shade(oceanCol, 1.3) + '\"/>\u003cstop offset=\".55\" stop-color=\"' + oceanCol + '\"/>\u003cstop offset=\"1\" stop-color=\"' + shade(oceanCol, .38) + '\"/>\u003c/radialGradient>'\r\n    + '\u003cradialGradient id=\"' + pre + 'shade\" cx=\"35%\" cy=\"30%\" r=\"80%\">\u003cstop offset=\".42\" stop-color=\"#000\" stop-opacity=\"0\"/>\u003cstop offset=\"1\" stop-color=\"#05061A\" stop-opacity=\".82\"/>\u003c/radialGradient>'\r\n    + '\u003cradialGradient id=\"' + pre + 'shine\" cx=\"30%\" cy=\"24%\" r=\"40%\">\u003cstop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".34\"/>\u003cstop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/>\u003c/radialGradient>'\r\n    + '\u003cradialGradient id=\"' + pre + 'glow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\u003cstop offset=\".6\" stop-color=\"' + glow + '\" stop-opacity=\".65\"/>\u003cstop offset=\"1\" stop-color=\"' + glow + '\" stop-opacity=\"0\"/>\u003c/radialGradient>'\r\n    + '\u003cradialGradient id=\"' + pre + 'moon\" cx=\"35%\" cy=\"30%\" r=\"70%\">\u003cstop offset=\"0\" stop-color=\"#e4e0f0\"/>\u003cstop offset=\"1\" stop-color=\"#6d6890\"/>\u003c/radialGradient>'\r\n    + (pw ? '\u003clinearGradient id=\"' + pre + 'ring\" x1=\"0\" x2=\"1\">\u003cstop offset=\"0\" stop-color=\"' + pw.c + '\" stop-opacity=\".2\"/>\u003cstop offset=\".5\" stop-color=\"#fff\"/>\u003cstop offset=\"1\" stop-color=\"' + pw.c + '\" stop-opacity=\".2\"/>\u003c/linearGradient>' : '')\r\n    + '\u003cfilter id=\"' + pre + 'soft\">\u003cfeGaussianBlur stdDeviation=\"5\"/>\u003c/filter>'\r\n    + '\u003cclipPath id=\"' + pre + 'clip\">\u003ccircle cx=\"300\" cy=\"300\" r=\"190\"/>\u003c/clipPath>'\r\n    + '\u003cpath id=\"' + pre + 'arc\" d=\"M 82 300 A 218 218 0 0 1 518 300\"/>\u003c/defs>';\r\n  s += '\u003ccircle class=\"breathe\" cx=\"300\" cy=\"300\" r=\"268\" fill=\"url(#' + pre + 'glow)\"/>';\r\n  // Кільце суперсили (задня половина — за планетою)\r\n  if (pw) s += '\u003cg transform=\"rotate(-14 300 300)\">\u003cellipse cx=\"300\" cy=\"300\" rx=\"285\" ry=\"66\" fill=\"none\" stroke=\"' + pw.c + '\" stroke-width=\"16\" opacity=\".35\" filter=\"url(#' + pre + 'soft)\"/>\u003cellipse cx=\"300\" cy=\"300\" rx=\"275\" ry=\"62\" fill=\"none\" stroke=\"url(#' + pre + 'ring)\" stroke-width=\"7\" opacity=\".6\"/>\u003c/g>';\r\n  // Летючі острови навколо планети (з'являються, щойно планета ожила; що більше етапів пройдено, то більше островів)\r\n  if (alive) {\r\n    const Ri = rng('isles');\r\n    const spots = [[92, 172, 30], [506, 150, 26], [520, 438, 32], [86, 430, 24], [300, 66, 20]];\r\n    const cnt = Math.min(spots.length, 2 + (v.cities.length ? 1 : 0) + (v.net ? 1 : 0) + (v.final ? 1 : 0));\r\n    spots.slice(0, cnt).forEach((sp, k) => {\r\n      const sky = skies[k] ? card('land', skies[k].id) : null;\r\n      s += '\u003cg class=\"bob\" style=\"animation-delay:' + (k * .9) + 's\">' + islandG(sp[0], sp[1], sp[2], Ri, sky ? '\u003ctext x=\"' + sp[0] + '\" y=\"' + (sp[1] - 8) + '\" text-anchor=\"middle\" font-size=\"26\">' + sky.e + '\u003c/text>' : '', k % 2 === 0) + '\u003c/g>';\r\n    });\r\n  }\r\n  s += '\u003ccircle cx=\"300\" cy=\"300\" r=\"190\" fill=\"url(#' + pre + (alive ? 'sea' : 'rock') + ')\"/>';\r\n  s += '\u003cg clip-path=\"url(#' + pre + 'clip)\">';\r\n  // Поверхня, що обертається\r\n  let surf = '';\r\n  if (!alive) {\r\n    [[60, 210, 18], [170, 380, 24], [250, 330, 12], [330, 250, 14], [430, 270, 9], [520, 420, 15], [600, 200, 20], [690, 350, 13]].forEach(c => {\r\n      surf += '\u003ccircle cx=\"' + c[0] + '\" cy=\"' + c[1] + '\" r=\"' + c[2] + '\" fill=\"#2a2f52\" opacity=\".6\"/>\u003ccircle cx=\"' + (c[0] - c[2] * .2) + '\" cy=\"' + (c[1] - c[2] * .2) + '\" r=\"' + (c[2] * .75) + '\" fill=\"#4b5177\" opacity=\".35\"/>';\r\n    });\r\n  } else {\r\n    for (let k = 0; k \u003c 7; k++) surf += '\u003cpath d=\"' + wavyLine(130 + k * 56) + '\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\".13\"/>';\r\n    const Rw = rng('waves');\r\n    for (let k = 0; k \u003c 14; k++) surf += '\u003cpath class=\"glint\" style=\"animation-delay:' + fx(Rw() * 3) + 's\" d=\"M' + fx(Rw() * STRIP) + ' ' + fx(130 + Rw() * 340) + 'q7 -4 14 0\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/>';\r\n    grounds.forEach((l, i) => {\r\n      const cd = card('land', l.id); const n = grounds.length; const R = rng(l.id);\r\n      const x = (i + .5) * STRIP / n, y = 300 + (i % 2 ? 62 : -58) + (R() - .5) * 50, r = Math.min(84 + Math.min(4, l.n) * 9, STRIP / n * .62); // щоб між континентами лишався океан\r\n      const water = kindOf(cd) === 'water';\r\n      let g = '\u003cg' + (isNew(l.id) ? ' class=\"pop\"' : '') + '>';\r\n      g += '\u003cpath d=\"' + blobPath(x, y, r + 7, l.id) + '\" fill=\"#fff\" opacity=\".22\"/>'; // піна біля берега\r\n      g += '\u003cpath d=\"' + blobPath(x, y, r, l.id) + '\" fill=\"' + (water ? cd.c : '#4f9a3f') + '\"/>';\r\n      g += '\u003cpath d=\"' + blobPath(x - 4, y - 4, r * .82, l.id + 'b') + '\" fill=\"' + cd.c + '\" opacity=\"' + (water ? .9 : .85) + '\"/>';\r\n      g += '\u003cpath d=\"' + blobPath(x - 10, y - 12, r * .5, l.id + 'h') + '\" fill=\"#fff\" opacity=\".13\"/>';\r\n      g += paintLand(cd, x, y, r * .75, R);\r\n      g += '\u003ctext x=\"' + fx(x + r * .45) + '\" y=\"' + fx(y + r * .55) + '\" text-anchor=\"middle\" font-size=\"24\" style=\"filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))\">' + cd.e + '\u003c/text>';\r\n      // нічні вогні з'являються, коли збудовано міста\r\n      if (v.lights) { const Rl = rng(l.id + 'L'); for (let k = 0; k \u003c 10; k++) g += '\u003ccircle class=\"glint\" style=\"animation-delay:' + fx(Rl() * 3) + 's\" cx=\"' + fx(x + (Rl() - .5) * r * 1.2) + '\" cy=\"' + fx(y + (Rl() - .5) * r * .9) + '\" r=\"1.8\" fill=\"#fff3a0\"/>'; }\r\n      surf += g + '\u003c/g>';\r\n    });\r\n  }\r\n  s += '\u003cg class=\"surf\" style=\"animation-delay:' + phase(120) + '\">\u003cg>' + surf + '\u003c/g>\u003cg transform=\"translate(' + STRIP + ',0)\">' + surf + '\u003c/g>\u003c/g>';\r\n  if (ice) s += '\u003cpath d=\"M120 128 Q300 52 480 128 Q420 150 360 138 Q300 158 240 140 Q180 152 120 128Z\" fill=\"#F2FBFF\" opacity=\".95\"/>\u003cpath d=\"M150 468 Q300 548 450 468 Q390 452 330 462 Q270 448 210 462 Q170 456 150 468Z\" fill=\"#F2FBFF\" opacity=\".95\"/>';\r\n  // Хмари пливуть швидше за поверхню\r\n  if (alive) {\r\n    let cl = ''; const Rc = rng('clouds' + lands.length);\r\n    for (let k = 0; k \u003c 9; k++) { const x = Rc() * STRIP, y = 130 + Rc() * 340, w = 34 + Rc() * 50; cl += '\u003cg opacity=\".7\">\u003cellipse cx=\"' + fx(x) + '\" cy=\"' + fx(y) + '\" rx=\"' + fx(w) + '\" ry=\"' + fx(w * .26) + '\" fill=\"#fff\"/>\u003cellipse cx=\"' + fx(x + w * .25) + '\" cy=\"' + fx(y - 7) + '\" rx=\"' + fx(w * .45) + '\" ry=\"' + fx(w * .26) + '\" fill=\"#fff\"/>\u003cellipse cx=\"' + fx(x - w * .3) + '\" cy=\"' + fx(y - 4) + '\" rx=\"' + fx(w * .32) + '\" ry=\"' + fx(w * .2) + '\" fill=\"#fff\"/>\u003c/g>'; }\r\n    s += '\u003cg class=\"clouds\" style=\"animation-delay:' + phase(70) + '\">\u003cg>' + cl + '\u003c/g>\u003cg transform=\"translate(' + STRIP + ',0)\">' + cl + '\u003c/g>\u003c/g>';\r\n  }\r\n  s += '\u003ccircle cx=\"300\" cy=\"300\" r=\"190\" fill=\"url(#' + pre + 'shade)\"/>\u003ccircle cx=\"300\" cy=\"300\" r=\"190\" fill=\"url(#' + pre + 'shine)\"/>\u003c/g>';\r\n  // Світлий обідок атмосфери\r\n  s += '\u003ccircle cx=\"300\" cy=\"300\" r=\"192\" fill=\"none\" stroke=\"' + glow + '\" stroke-width=\"5\" opacity=\".55\" filter=\"url(#' + pre + 'soft)\"/>';\r\n  // Диво планети — завжди спереду\r\n  const wcd = v.wonder && lands.some(l => l.id === v.wonder) ? card('land', v.wonder) : null;\r\n  if (wcd) s += '\u003ccircle class=\"breathe\" cx=\"300\" cy=\"292\" r=\"52\" fill=\"' + wcd.c + '\" opacity=\".45\" filter=\"url(#' + pre + 'soft)\"/>\u003ctext x=\"300\" y=\"314\" text-anchor=\"middle\" font-size=\"60\" style=\"filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))\">' + wcd.e + '\u003c/text>\u003ctext x=\"342\" y=\"252\" font-size=\"26\" style=\"animation:pulse 1.4s infinite\">✨\u003c/text>\u003ctext x=\"246\" y=\"346\" font-size=\"20\" style=\"animation:pulse 1.8s infinite\">✨\u003c/text>';\r\n  // Мережа світла між містами (після Конституції)\r\n  if (v.net && v.cities.length > 1) {\r\n    const pts = v.cities.map(c => CITY_POS[c.k % 4]);\r\n    pts.forEach((a, i) => { const b = pts[(i + 1) % pts.length]; if (pts.length === 2 && i === 1) return; s += '\u003cpath class=\"flow\" d=\"M' + a[0] + ' ' + a[1] + 'Q300 300 ' + b[0] + ' ' + b[1] + '\" fill=\"none\" stroke=\"#ffd23f\" stroke-width=\"3\" stroke-dasharray=\"4 10\" opacity=\".85\"/>'; });\r\n  }\r\n  // Міста: хмарочоси з вогнями, вежа з маячком, літаючі машинки\r\n  v.cities.forEach(c => {\r\n    const [x, y] = CITY_POS[c.k % 4]; const col = CONT[c.k % 4].c; const R = rng('city' + c.k);\r\n    let g = '\u003cg transform=\"translate(' + x + ',' + y + ')\">';\r\n    g += '\u003cellipse cx=\"0\" cy=\"14\" rx=\"50\" ry=\"12\" fill=\"' + col + '\" opacity=\".45\" filter=\"url(#' + pre + 'soft)\"/>';\r\n    if (c.building && !c.name) g += '\u003ctext x=\"0\" y=\"12\" text-anchor=\"middle\" font-size=\"34\">🏗️\u003c/text>';\r\n    else {\r\n      const towers = [[-34, 12, 26], [-22, 13, 44], [-8, 14, 58], [7, 12, 40], [20, 13, 52], [33, 11, 30]];\r\n      towers.forEach(([bx, w, h], b) => {\r\n        h += R() * 10;\r\n        g += '\u003crect x=\"' + fx(bx - w / 2) + '\" y=\"' + fx(14 - h) + '\" width=\"' + w + '\" height=\"' + fx(h) + '\" rx=\"2\" fill=\"' + shade(col, .55) + '\" stroke=\"#05061A\" stroke-width=\"1.2\"/>'\r\n          + '\u003crect x=\"' + fx(bx - w / 2) + '\" y=\"' + fx(14 - h) + '\" width=\"' + fx(w * .45) + '\" height=\"' + fx(h) + '\" fill=\"' + col + '\" opacity=\".65\"/>';\r\n        for (let wy = 14 - h + 5; wy \u003c 10; wy += 6) for (let wx = bx - w / 2 + 3; wx \u003c bx + w / 2 - 3; wx += 5) if (R() > .35) g += '\u003crect class=\"win\" style=\"animation-delay:' + fx(R() * 3) + 's\" x=\"' + fx(wx) + '\" y=\"' + fx(wy) + '\" width=\"2.6\" height=\"2.6\" fill=\"#FFF6B0\"/>';\r\n        if (b === 2) g += '\u003cline x1=\"' + bx + '\" y1=\"' + fx(14 - h) + '\" x2=\"' + bx + '\" y2=\"' + fx(4 - h) + '\" stroke n(url => { if (!url || musicSlot !== slot || !soundOn) return; musicEl = new Audio(url); musicEl.loop = true; musicEl.volume = Math.min(1, VOL / 100); musicEl.play().catch(() => {}); }).catch(() => { if (CFG.settings.synth) startPad(); });\r\n}\r\nconst musicCache = {};\r\nfunction loadMusic(slot) {\r\n  if (musicCache[slot]) return Promise.resolve(musicCache[slot]);\r\n  return call('getMusic', slot, 0).then(first => {\r\n    if (!first.total) return '';\r\n    if (first.url) return (musicCache[slot] = first.url);\r\n    const parts = [first.data]; let chain = Promise.resolve();\r\n    for (let i = 1; i \u003c first.total; i++) chain = chain.then(() => call('getMusic', slot, i).then(r => { parts.push(r.data); }));\r\n    return chain.then(() => { const bin = atob(parts.join('')); const arr = new Uint8Array(bin.length); for (let i = 0; i \u003c bin.length; i++) arr[i] = bin.charCodeAt(i); return (musicCache[slot] = URL.createObjectURL(new Blob([arr], { type: first.type }))); });\r\n  });\r\n}\r\nfunction toggleSound() {\r\n  soundOn = !soundOn;\r\n  if (soundOn) {\r\n    try { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.connect(AC.destination); } AC.resume(); applyVol(); } catch (e) {}\r\n    updateMusic(); sfx('step');\r\n  } else { stopPad(); if (musicEl) { musicEl.pause(); musicEl = null; musicSlot = ''; } }\r\n  const b = $('#sndBtn'); if (b) b.textContent = soundOn ? '🔊 Звук' : '🔇 Увімкнути звук';\r\n}\r\n\r\n\r\n/* ================= ЗОРЯНЕ НЕБО ================= */\r\nfunction stars() {\r\n  const cv = $('#stars'), cx = cv.getContext('2d'); let W, H, st = [], shoot = null;\r\n  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; st = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .2, p: Math.random() * 6, s: Math.random() * .02 + .005 })); };\r\n  size(); addEventListener('resize', size);\r\n  c ======== */\r\nlet SCR_KEY = '', LAST_PV = '', LAST_ORB = '', PL_SEEN = [], KOMPA_T = [], SEEN_ITEMS = {}, WHEEL_T = [];\r\nfunction buildScreenShell() {\r\n  $('#app').innerHTML = '\u003cdiv class=\"bg-deco\">\u003ci class=\"neb\">\u003c/i>\u003ci class=\"neb2\">\u003c/i>\u003ci class=\"p1\">\u003c/i>\u003ci class=\"p2\">\u003c/i>\u003ci class=\"p3\">\u003c/i>\u003c/div>\u003cdiv class=\"scr\">\u003cdiv class=\"s-top\">\u003cdiv class=\"s-logo\">🌍 \u003cb>' + esc(CFG.settings.title.toUpperCase()) + '\u003c/b>\u003c/div>\u003cdiv class=\"s-prog\" id=\"sProg\">\u003c/div>'\r\n    + '\u003cdiv class=\"s-timer hidden\" id=\"sTimer\">\u003csvg width=\"84\" height=\"84\">\u003ccircle cx=\"42\" cy=\"42\" r=\"36\" stroke=\"rgba(255,255,255,.1)\" stroke-width=\"7\" fill=\"none\"/>\u003ccircle id=\"sTimerC\" cx=\"42\" cy=\"42\" r=\"36\" stroke=\"#2EE6C8\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"226\" stroke-dashoffset=\"0\"/>\u003c/svg>\u003cdiv class=\"tt js-timer\">0:00\u003c/div>\u003c/div>\u003c/div>'\r\n    + '\u003cdiv class=\"s-main\">\u003cdiv class=\"s-planet\">\u003cdiv class=\"pl-wrap\" id=\"plWrap\">\u003cdiv id=\"plSvg\">\u003c/div>\u003cdiv id=\"orbSvg\">\u003c/div>\u003c/div>\u003c/div>'\r\n    + '\u003cdiv class=\"s-side\">\u003cdiv class=\"kompa\" id=\"kompa\">\u003cdiv class=\"face\">' + kompaSVG() + '\u003c/div>\u003cdiv class=\"lines\" id=\"kLines\">\u003c/div>\u003c/div>\u003cdiv class=\"s-box\" id=\"sBox\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>'\r\n    + '\u003cdiv class=\"sound-box\">\u003cbutton class=\"btn ghost sm\" id=\"sndBtn\" onclick=\"toggleSound()\">🔇 Увімкнути звук\u003c/button>\u003cinput type=\"range\" id=\"volR\" min=\"0\" max=\"100\" value=\"' + VOL + '\" oninput=\"setVol(this.value)\" title=\"Гучність\">\u003cspan id=\"volL\">' + VOL + '%\u003c/span>\u003c/div>'\r\n    + (MODE === 'host' ? '\u003cbutton class=\"btn sm dr-btn\" onclick=\"toggleDrawer()\">🎛 Пульт\u003c/button>\u003cdiv class=\"drawer\" id=\"drawer\">\u003cdiv id=\"pultBox\">\u003c/div>\u003c/div>' : '');\r\n}\r\nfunction toggleDrawer() { $('#drawer').classList.toggle('open'); }\r\nfunction renderScreen() {\r\n  if (!$('#sBox')) buildScreenShell();\r\n  const key = curKey(), [stg, stp] = cur();\r\n  // Прогрес етапів угорі\r\n  const si = STAGE_KEYS.indexOf(stg);\r\n  $('#sProg').innerHTML = STAGE_KEYS.filter(k => k !== 'intro').map(k => { const c = stageCfg(k); const i = STAGE_KEYS.indexOf(k); return '\u003cspan class=\"' + (k === stg ? 'on' : i \u003c si ? 'past' : '') + '\">' + c.emoji + ' ' + esc(c.title) + '\u003c/span>'; }).join('');\r\n  // Планета (перемальовуємо лише якщо щось змінилось)\r\n  const pv = planetView(); const pvs = JSON.stringify(pv);\r\n  if (pvs !== LAST_PV) {\r\n    const ids = pv.lands.map(l => 'L' + l.id); const fresh = ids.filter(i => PL_SEEN.indexOf(i) \u003c 0);\r\n    $('#plSvg').innerHTML = planetSVG(pv, 'm', { newIds: LAST_PV ? fresh : [] });\r\n    if (LAST_PV && fresh.length) sfx('blip');\r\n    PL_SEEN = ids; LAST_PV = pvs;\r\n  }\r\n  if (S.vol != null && S.vol !== VOL_SRV) { VOL_SRV = S.vol; setVol(S.vol); }\r\n  const orb = JSON.stringify([players().map(p => [p.pid, p.n, p.a]), islesOn()]);\r\n  if (orb !== LAST_ORB) { if (LAST_ORB && orb.length > LAST_ORB.length) sfx('blip'); $('#orbSvg').innerHTML = orbitSVG(); LAST_ORB = orb; }\r\n  if (key !== SCR_KEY) {\r\n    const first = !SCR_KEY;\r\n    SCR_KEY = key; SEEN_ITEMS = {};\r\n    playKompa(key);\r\n    WHEEL_T.forEach(clearTimeout); WHEEL_T = [];\r\n    $('#sBox').innerHTML = '\u003cdiv id=\"sStatic\">\u003c/div>\u003cdiv id=\"sDyn\">\u003c/div>';\r\n    $('#sStatic').innerHTML = screenStatic(stg, stp);\r\n    if (stg === 'lobby') drawQR();\r\n    if (stp === 'wheel') runWheel();\r\n    if (!first) sfx(stp === 'reveal' || stg === 'final' ? 'reveal' : stp === 'alarm' ? 'alarm' : 'step');\r\n    updateMusic();\r\n  }\r\n  $('#sDyn').innerHTML = screenDyn(stg, stp);\r\n}\r\n/* Репліки КОМПИ: з'являються по черзі, ніби вона друкує */\r\nfunction playKompa(key) {\r\n  KOMPA_T.forEach(clearTimeout); KOMPA_T = [];\r\n  const box = $('#kLines'); box.innerHTML = '';\r\n  const ls = linesFor(key); let at = 300;\r\n  ls.forEach((t, i) => {\r\n    KOMPA_T.push(setTimeout(() => {\r\n      [...box.children].forEach(c => c.classList.add('old'));\r\n      while (box.children.length > 2) box.removeChild(box.firstChild);\r\n      const el = document.createElement('div'); el.className = 'kb'; box.appendChild(el);\r\n      $('#kompa').classList.add('talking');\r\n      let n = 0; const typ = () => { n += 2; el.textContent = t.slice(0, n); if (n \u003c t.length) KOMPA_T.push(setTimeout(typ, 28)); else $('#kompa').classList.remove('talking'); };\r\n      typ();\r\n    }, at));\r\n    at += Math.max(2600, t.length * 28 + 1700);\r\n  });\r\n}\r\nfunction drawQR() {\r\n  const el = $('#qr'); if (!el || !window.QRCode || !CFG.url) return;\r\n  el.innerHTML = ''; new QRCode(el, { text: CFG.url, width: 230, height: 230, colorDark: '#0B1026', colorLight: '#ffffff' });\r\n}\r\nfunction screenStatic(stg, stp) {\r\n  const sc = stageCfg(stg);\r\n  const head = '\u003cdiv class=\"s-h\">' + sc.emoji + ' ' + esc(sc.title) + (STEP_NAMES[stp] && stg !== 'lobby' && stg !== 'final' ? ' \u003cspan class=\"mut\" style=\"font-size:.6em\">· ' + STEP_NAMES[stp] + '\u003c/span>' : '') + '\u003c/div>';\r\n  if (stg === 'lobby') return '\u003cdiv class=\"lobby\">\u003cdiv class=\"qr-card\">\u003cdiv id=\"qr\">\u003c/div>\u003cb>Скануй і злітай на орбіту!\u003c/b>\u003c/div>\u003cdiv style=\"flex:1;min-width:220px\">\u003cdiv class=\"join-hint\">1. Наведи камеру телефона на QR-код\u003cbr>2. Введи ім\\'я\u003cbr>3. Збери свого прибульця\u003c/div>\u003cdiv class=\"s-sub\" style=\"margin-top:14px;word-break:break-all\">' + esc(CFG.url || '') + '\u003c/div>\u003c/div>\u003c/div>';\r\n  if (stg === 'intro') return head;\r\n  if (stp === 'reveal') return head + revealScreen(stg);\r\n  if (stg === 'cities' && stp === 'wheel') {\r\n    const mods = CARDS.mod; return head + '\u003cdiv class=\"wheelbox\">\u003cdiv class=\"wheel\">\u003cdiv class=\"ptr\">\u003c/div>' + wheelSVG(mods) + '\u003c/div>\u003cdiv class=\"wres\" id=\"wRes\">\u003c/div>\u003c/div>';\r\n  }\r\n  if (stg === 'crisis' && stp === 'alarm') { const c = CFG.crises[S.crisis] || {}; return '\u003cdiv class=\"alarm\">\u003cdiv class=\"em\">' + (c.e || '☄️') + '\u003c/div>\u003cdiv class=\"s-h\" style=\"color:#ff9fb2\">' + esc(c.n) + '\u003c/div>\u003cdiv class=\"join-hint\">' + esc(c.d) + '\u003c/div>\u003c/div>'; }\r\n  const newBtn = MODE === 'host' ? '\u003cbutton class=\"btn sm pink\" onclick=\"newGame(this)\">🔄 Нова гра\u003c/button>' : '';\r\n  if (stg === 'final' && stp === 'passport') return passportHTML('pScr') + (MODE === 'host' ? '\u003cdiv style=\"margin-top:10px;display:flex;gap:8px\">\u003cbutton class=\"btn sm ghost\" onclick=\"saveImg(\\'pScr\\',\\'паспорт-планети\\')\">⬇ Зберегти паспорт\u003c/button>' + newBtn + '\u003c/div>' : '');\r\n  if (stg === 'final' && stp === 'awards') return awardsScreen() + (newBtn ? '\u003cdiv style=\"margin-top:12px\">' + newBtn + '\u003c/div>' : '');\r\n  return head + (stp === 'input' || stp === 'vote' ? '\u003cdiv class=\"s-sub\">' + esc(stp === 'vote' ? (sc.taskVote || '') : (sc.taskIn || '')) + '\u003c/div>' : '');\r\n}\r\nfunction screenDyn(stg, stp) {\r\n  const cnt = () => { const c = doneCount(); return '\u003cdiv style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\u003cspan class=\"cnt\">' + c.d + ' / ' + c.n + '\u003c/span>\u003cspan class=\"mut\">' + (stp === 'vote' ? 'проголосували' : 'вже відповіли') + '\u003c/span>\u003c/div>'; };\r\n  if (stg === 'lobby') return '\u003cdiv style=\"margin-top:18px\">\u003cdiv style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\u003cspan class=\"cnt\">' + players().length + '\u003c/span>\u003cspan class=\"mut\">прибульців на орбіті\u003c/span>\u003c/div>' + whoHTML() + '\u003c/div>';\r\n  if (stg === 'cities' && stp === 'split') return citiesSplitHTML();\r\n  if (stg === 'cities' && (stp === 'input' || stp === 'vote')) return cnt() + citiesLiveHTML(stp === 'vote');\r\n  if (stg === 'land' && stp === 'vote') return cnt() + optCards(uniqueLandPicks().map(id => { const c = card('land', id); return c ? { e: c.e, t: c.n, d: c.d } : null; }).filter(Boolean)) + '\u003cdiv style=\"height:12px\">\u003c/div>' + whoHTML();\r\n  if (stg === 'name' && stp === 'vote') return cnt() + optCards(Object.keys(SUBS.input || {}).filter(p => S.players[p]).map(p => ({ e: '🏷️', t: SUBS.input[p].v }))) + '\u003cdiv style=\"height:12px\">\u003c/div>' + whoHTML();\r\n  if (stg === 'crisis' && stp === 'input') return cnt() + crisisBars(false) + whoHTML();\r\n  if (stg === 'crisis' && stp === 'alarm') return '\u003cdiv style=\"margin-top:14px\">' + optCards((CFG.crises[S.crisis] || { opts: [] }).opts.map((o, i) => ({ e: ['🅰️', '🅱️', '©️', '🇩'][i] || '•', t: o.t }))) + '\u003c/div>';\r\n  if (stg === 'power' && stp === 'input') { const t = {}; Object.keys(SUBS.input || {}).forEach(p => { const id = SUBS.input[p].v.p; t[id] = (t[id] || 0) + 1; }); return cnt() + barsHTML(S.powerOpts.map(id => { const c = card('power', id) || {}; return { t: (c.e || '') + ' ' + (c.n || id), n: t[id] || 0, c: c.c }; })) + whoHTML(); }\r\n  if (stg === 'power' && stp === 'vote') return cnt() + optCards(Object.keys(SUBS.input || {}).filter(p => S.players[p] && SUBS.input[p].v.h).map(p => ({ e: '🎉', t: SUBS.input[p].v.h }))) + '\u003cdiv style=\"height:12px\">\u003c/div>' + whoHTML();\r\n  if (stg === 'contact' && stp === 'input') { const ws = Object.keys(SUBS.input || {}).filter(p => S.players[p]).sort((a, b) => SUBS.input[a].t - SUBS.input[b].t).map(p => SUBS.input[p].v); return cnt() + '\u003cdiv class=\"card msg\">' + (ws.length ? ws.map(w => '\u003cspan>' + esc(w) + '\u003c/span>').join('') : '\u003cspan class=\"mut\">📡 Чекаємо на перше слово…\u003c/span>') + '\u003c/div>\u003cdiv style=\"height:12px\">\u003c/div>' + whoHTML(); }\r\n  if (stg === 'laws' && stp === 'vote') return cnt() + whoHTML(true);\r\n  if (stp === 'input' || stp === 'vote') return cnt() + whoHTML();\r\n  return '';\r\n}\r\nfunction optCards(list) { return '\u003cdiv class=\"optlist\">' + list.map(o => '\u003cdiv class=\"oc\">\u003cspan class=\"em\">' + o.e + '\u003c/span>' + esc(o.t) + (o.d ? '\u003csmall>' + esc(o.d) + '\u003c/small>' : '') + '\u003c/div>').join('') + '\u003c/div>'; }\r\nfunction barsHTML(list, winIdx) {\r\n  const max = Math.max(1, ...list.map(x => x.n));\r\n  return '\u003cdiv class=\"bars\">' + list.map((x, i) => '\u003cdiv class=\"b' + (i === winIdx ? ' win' : '') + '\">\u003cdiv class=\"bt\">\u003cspan>' + (i === winIdx ? '🏆 ' : '') + esc(x.t) + '\u003c/span>\u003cspan>' + x.n + '\u003c/span>\u003c/div>\u003cdiv class=\"bb\">\u003ci style=\"width:' + Math.round(x.n / max * 100) + '%;background:' + (x.c || 'linear-gradient(90deg,#2EE6C8,#8B5CF6)') + '\">\u003c/i>\u003c/div>\u003c/div>').join('') + '\u003c/div>';\r\n}\r\nfunction uniqueLandPicks() { const t = {}; Object.keys(SUBS.input || {}).forEach(p => { if (S.players[p]) t[SUBS.input[p].v] = 1; }); return Object.keys(t); }\r\nfunction crisisBars(final) {\r\n  const c = CFG.crises[final ? P.crisis.i : S.crisis] || { opts: [] };\r\n  let tot;\r\n  if (final) tot = P.crisis.tot; else { tot = c.opts.map(() => 0); Object.keys(SUBS.input || {}).forEach(p => (SUBS.input[p].v || []).forEach((n, k) => { if (k \u003c tot.length) tot[k] += n; })); }\r\n  return barsHTML(c.opts.map((o, i) => ({ t: '💎 ' + o.t, n: tot[i] || 0, c: ['#2EE6C8', '#B57CFF', '#FF9A4D', '#FF6FB5'][i] })), final ? P.crisis.win : -1);\r\n}\r\nfunction citiesSplitHTML() {\r\n  return '\u003cdiv class=\"cities\">' + S.teams.map(t => { const c = CONT[+t.id.slice(1)]; return '\u003cdiv class=\"city fadeUp\" style=\"border-color:' + c.c + '\">\u003ch3 style=\"color:' + c.c + '\">' + c.e + ' ' + esc(c.n) + '\u003c/h3>' + t.m.map((pid, k) => { const r = CARDS.role[k % CARDS.role.length] || {}; return '\u003cdiv class=\"mem\">' + alienSVG((S.players[pid] || {}).a, 30) + (r.e || '') + ' ' + esc(pname(pid)) + ' \u003cspan class=\"mut\" style=\"font-weight:600\">· ' + esc(r.n || '') + '\u003c/span>\u003c/div>'; }).join('') + '\u003c/div>'; }).join('') + '\u003c/div>';\r\n}\r\nfunction citiesLiveHTML() {\r\n  return '\u003cdiv class=\"cities\">' + S.teams.map(t => {\r\n    const c = CONT[+t.id.slice(1)]; const mod = card('mod', t.mod); const mayor = sub('input', t.m[0]);\r\n    return '\u003cdiv class=\"city\" style=\"border-color:' + c.c + '\">\u003ch3 style=\"color:' + c.c + '\">' + c.e + ' ' + esc(mayor ? mayor.v : 'Місто будується…') + '\u003c/h3>' + (mod ? '\u003cdiv class=\"mod\">' + mod.e + ' ' + esc(mod.n) + '\u003c/div>' : '')\r\n      + t.m.slice(1).map((pid, j) => { const r = CARDS.role[(j + 1) % CARDS.role.length] || {}; const a = sub('input', pid); const id = pid + (a ? a.v : ''); const isNew = a && !SEEN_ITEMS[id]; if (a) SEEN_ITEMS[id] = 1; return '\u003cdiv class=\"it' + (a ? '' : ' wait') + (isNew ? ' fadeUp' : '') + '\">\u003cb>' + (r.e || '') + ' ' + esc(r.n || '') + ':\u003c/b> ' + (a ? esc(a.v) : '…думає') + '\u003c/div>'; }).join('') + '\u003c/div>';\r\n  }).join('') + '\u003c/div>';\r\n}\r\nfunction revealScreen(stg) {\r\n  if (stg === 'land') {\r\n    const w = card('land', P.wonder) || {};\r\n    return '\u003cdiv class=\"bigcard pop\">\u003cdiv class=\"k\">ДИВО ПЛАНЕТИ\u003c/div>\u003cdiv class=\"em\">' + (w.e || '✨') + '\u003c/div>\u003ch2>' + esc(w.n || '') + '\u003c/h2>\u003cdiv class=\"s-sub\">' + esc(w.d || '') + '\u003c/div>\u003c/div>\u003cdiv style=\"height:12px\">\u003c/div>'\r\n      + optCards((P.lands || []).filter(l => l.id !== P.wonder).map(l => { const c = card('land', l.id) || {}; return { e: c.e, t: c.n, d: c.d }; }));\r\n  }\r\n  if (stg === 'name') {\r\n    const votes = P.nameVotes || {}; const ins = SUBS.input || {};\r\n    const list = Object.keys(ins).filter(p => idth=\"2\" opacity=\".92\"/>';\r\n    s += '\u003ctext x=\"' + fx(Math.cos(am) * 105) + '\" y=\"' + fx(Math.sin(am) * 105 + 9) + '\" text-anchor=\"middle\" font-size=\"24\">' + m.e + '\u003c/text>';\r\n  });\r\n  return s + '\u003ccircle r=\"26\" fill=\"#0B1026\" stroke=\"#FFD23F\" stroke-width=\"4\"/>\u003ctext y=\"8\" text-anchor=\"middle\" font-size=\"22\">🎡\u003c/text>\u003c/svg>';\r\n}\r\nconst WHEEL_GAP = 6500;\r\nfunction wheelStart(k) { return S.stepAt + 1800 + k * WHEEL_GAP; }\r\nfunction runWheel() {\r\n  const mods = CARDS.mod, n = Math.max(1, mods.length), a = 360 / n;\r\n  S.teams.forEach((t, k) => {\r\n    const idx = Math.max(0, mods.findIndex(m => m.id === t.mod));\r\n    const rot = 360 * 6 * (k + 1) - (idx + .5) * a;\r\n    const show = () => { const c = CONT[+t.id.slice(1)]; const m = mods[idx] || {}; const el = document.createElement('div'); el.className = 'r pop'; el.style.borderColor = c.c; el.innerHTML = '\u003cspan style=\"color:' + c.c + '\">' + c.e + ' ' + esc(c.n) + '\u003c/span>\u003cbr>' + m.e + ' ' + esc(m.n); const box = $('#wRes'); if (box) box.appendChild(el); sfx('reveal'); };\r\n    const spin = (instant) => { const w = $('#wheelSvg'); if (!w) return; if (instant) { w.style.transition = 'none'; } else { w.style.transition = ''; } w.style.transform = 'rotate(' + rot + 'deg)'; };\r\n    const st = wheelStart(k) - now();\r\n    if (st + 4600 \u003c= 0) { spin(true); show(); }\r\n    else { WHEEL_T.push(setTimeout(() => { spin(false); for (let i = 0; i \u003c 10; i++) WHEEL_T.push(setTimeout(() => sfx('tick'), i * i * 40)); }, Math.max(0, st))); WHEEL_T.push(setTimeout(show, Math.max(0, st) + 4600)); }\r\n  });\r\n}\r\nfunction awardsScreen() {\r\n  const ps = players(); const T = A.t || {};\r\n  const top = (A.top || []).map((p, i) => ['🥇', '🥈', '🥉'][i] + ' ' + esc(pname(p)) + ' — ' + ((A.total || {})[p] || 0) + ' 💫').join(' &nbsp; ');\r\n  return '\u003cdiv class=\"s-h\">🏅 Звання засновників\u003c/div>' + (top ? '\u003cdiv class=\"s- 3c/button>';\r\n}\r\n\r\n/* ================= ТЕЛЕФОН ГРАВЦЯ ================= */\r\nlet PID = window.__UID || store('pfn_pid');\r\nif (!PID) { PID = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); store('pfn_pid', PID); }\r\nlet ALIEN = (() => { try { return JSON.parse(store('pfn_alien') || 'null') || randAlien(); } catch (e) { return randAlien(); } })();\r\nlet PV_KEY = '', LOCAL = {}, LOCAL_STEP = '', EDIT_ALIEN = false;\r\nconst me = () => S && S.players[PID];\r\n\r\nfunction renderPlayer() {\r\n  if (!$('#pmain')) $('#app').innerHTML = '\u003cdiv class=\"ph\">\u003cdiv class=\"ph-top\" id=\"ptop\">\u003c/div>\u003cdiv class=\"ph-stage\" id=\"pstage\">\u003c/div>\u003cdiv class=\"tbar hidden\" id=\"ptbar\">\u003ci>\u003c/i>\u003c/div>\u003cdiv id=\"pmain\">\u003c/div>\u003c/div>';\r\n  const [stg, stp] = cur();\r\n  const step = stg + '.' + stp;\r\n  if (step !== LOCAL_STEP) { LOCAL = {}; LOCAL_STEP = step; }\r\n  const m = me();\r\n  $('#ptop').innerHTML = m ? alienSVG(m.a, 40) + '\u003cspan class=\"nm\">' + esc(m.n) + '\u003c/span>\u003cspan class=\"dust\">💫 ' + dustOf(PID) + '\u003c/span>' : '\u003cspan class=\"nm\">🌍 ' + esc(CFG.settings.title) + '\u003c/span>';\r\n  const sc = stageCfg(stg);\r\n  $('#pstage').innerHTML = m ? '\u003cspan class=\"tag\">' + sc.emoji + ' ' + esc(sc.title) + '\u003c/span>' + (STEP_NAMES[stp] && stg !== 'lobby' ? '\u003cspan>' + STEP_NAMES[stp] + '\u003c/span>' : '') : '';\r\n  const key = (!m || EDIT_ALIEN) ? 'join' : step + '|' + playerSubKey(stg, stp);\r\n  if (key !== PV_KEY) { PV_KEY = key; $('#pmain').innerHTML = key === 'join' ? joinView() : playerView(stg, stp); afterPlayer(stg, stp); }\r\n}\r\n/* Частина ключа, від якої залежить вигляд (без текстових полів, щоб не збивати набір тексту) */\r\nfunction playerSubKey(stg, stp) {\r\n  const mine = sub(stp, PID);\r\n  if (stp === 'input' && ['name', 'cities', 'laws', 'power', 'contact'].indexOf(stg) >= 0) return (mine && !LOCAL.edit ? 'done' 3cbutton onclick=\"alienStep(\\'' + k + '\\',1)\">▶\u003c/button>\u003c/div>').join('') + '\u003c/div>'\r\n    + '\u003cdiv class=\"row\">\u003cbutton class=\"btn ghost\" onclick=\"alienRandom()\">🎲 Випадковий\u003c/button>\u003cbutton class=\"btn cy\" id=\"jBtn\" onclick=\"doJoin()\">На орбіту! 🚀\u003c/button>\u003c/div>\u003c/div>';\r\n}\r\nfunction alienStep(k, d) { const n = AL_OPTS[k].length; ALIEN[k] = ((ALIEN[k] || 0) + d + n) % n; refreshAlien(); }\r\nfunction alienRandom() { ALIEN = randAlien(); refreshAlien(); }\r\nfunction refreshAlien() { $('#aPrev').innerHTML = alienSVG(ALIEN, 150); ['b', 'c', 'y', 'm', 'x'].forEach(k => { $('#al_' + k).textContent = AL_OPTS[k][ALIEN[k] % AL_OPTS[k].length]; }); }\r\nfunction doJoin() {\r\n  const name = $('#jName').value.trim();\r\n  if (!name) return toast('Введи своє ім\\'я 🙂');\r\n  store('pfn_name', name); store('pfn_alien', JSON.stringify(ALIEN));\r\n  $('#jBtn').disabled = true;\r\n  call('joinGame', PID, name, ALIEN).then(() => { EDIT_ALIEN = false; toast('🚀 Ти на орбіті!'); VER = ''; poll(); })\r\n    .catch(e => { toast('⚠️ ' + (e.message || e)); $('#jBtn').disabled = false; });\r\n}\r\nfunction send(stage, step, value, quiet) {\r\n  const old = (SUBS[step] || {})[PID];\r\n  (SUBS[step] = SUBS[step] || {})[PID] = { v: value, t: old ? old.t : now() }; // показуємо одразу, не чекаючи сервера\r\n  LOCAL.edit = false;\r\n  renderPlayer();\r\n  return call('submit', PID, stage, step, value).then(r => {\r\n    if (r && r.ok) { if (!quiet) toast('✅ Прийнято!'); }\r\n    else if (r && r.late) toast('⏱ Цей крок уже завершився');\r\n    else if (r && r.unknown) { toast('Схоже, гру перезапустили — увійди ще раз'); VER = ''; }\r\n    poll();\r\n  }).catch(() => toast('⚠️ Не відправилось, спробуй ще раз'));\r\n}\r\nfunction passiveView(icon, title, text) { return '\u003cdiv class=\"card done fadeUp\">\u003cdiv class=\"big\">' + icon + '\u003c/div>\u003ch3>' + title + '\u003c/h3>' + (text ? '\u003cdiv class=\"mut\">' + text + '\u003c/div>' : '') + '\u003c/div>'; }\r\nfunction doneBox(text) { return '\u003cdiv class=\"card done pop\">\u003cdiv class=\"big\">✅\u003c/div>\u003ch3>Прийнято!\u003c/h3>\u003cdiv class=\"mut\" style=\"margin-bottom:12px\">' + text + '\u003c/div>\u003cbutton class=\"btn ghost sm\" onclick=\"LOCAL.edit=true;PV_KEY=\\'\\';renderPlayer()\">✏️ Змінити\u003c/button>\u003c/div>'; }\r\nfunction ideaBtn(target, list) { return '\u003cbutton class=\"btn ghost sm\" onclick=\"ideaFill(\\'' + target + '\\',' + esc(JSON.stringify(list)).replace(/\"/g, '&quot;') + ')\">🎲 Ідея\u003c/button>'; }\r\nfunction ideaFill(id, list) { const el = document.getElementById(id); if (el && list.length) { el.value = list[Math.floor(Math.random() * list.length)]; el.focus(); } }\r\nconst NAME_GEN = () => { const a = ['Фрак', 'Зор', 'Кос', 'Ну', 'Гала', 'Мрі', 'Кав', 'Лю', 'Сяй', 'Оріо', 'Плю', 'Бу', 'Квак', 'Нео', 'Вай', 'Дрім']; const b = ['то', 'ра', 'лі', 'мо', 'ні', 'ва', 'ксі', 'ре', '']; const c = ['нія', 'рія', 'тон', 'ланд', 'віль', 'ус', 'іда', 'лон', 'ея', 'кс']; const r = x => x[Math.floor(Math.random() * x.length)]; return r(a) + r(b) + r(c); };\r\nfunction genName() { $('#inName').value = NAME_GEN(); }\r\n\r\nfunction playerView(stg, stp) {\r\n  const sc = stageCfg(stg); const mine = sub(stp, PID);\r\n  const task = t => '\u003cdiv class=\"task\">' + esc(t) + '\u003c/div>';\r\n  if (stg === 'lobby') return passiveView(alienSVG(me().a, 120), 'Ти на орбіті! 🚀', 'Подивись на великий екран — твій прибулець уже літає навколо планети.') + '\u003cdiv style=\"text-align:center;margin-top:12px\">\u003cbutton class=\"btn ghost sm\" onclick=\"EDIT_ALIEN=true;ALIEN=Object.assign({},me().a);PV_KEY=\\'\\';renderPlayer()\">✏️ Змінити прибульця\u003c/button>\u003c/div>';\r\n  if (stg === 'intro') return passiveView('📡', 'Слухай КОМПУ', 'Головне зараз — на великому екрані 👀');\r\n  if (stp === 'reveal') return revealPhone(stg);\r\n  /* ЛАНДШАФТ */\r\n  if (stg === 'land' && stp === 'input') {\r\n    const three = sshuffle(CARDS.land, PID + S.gameId).slice(0, 3);\r\n    return task(sc.taskIn) + three.map(c => '\u003cbutton class=\"opt' + (mine && mine.v === c.id ? ' sel' : '') + '\" onclick=\"send(\\'land\\',\\'input\\',\\'' + c.id + '\\')\">\u003cspan class=\"em\">' + c.e + '\u003c/span>\u003cspan>' + esc(c.n) + '\u003csmall>' + esc(c.d) + '\u003c/small>\u003c/span>\u003c/button>').join('') + (mine ? '\u003cdiv class=\"mut\" style=\"text-align:center\">✅ Кинуто на планету! Можна передумати.\u003c/div>' : '');\r\n  }\r\n  if (stg === 'land' && stp === 'vote') return task(sc.taskVote) + uniqueLandPicks().map(id => { const c = card('land', id); return c ? '\u003cbutton class=\"opt' + (mine && mine.v === id ? ' sel' : '') + '\" onclick=\"send(\\'land\\',\\'vote\\',\\'' + id + '\\')\">\u003cspan class=\"em\">' + c.e + '\u003c/span>\u003cspan>' + esc(c.n) + '\u003csmall>' + esc(c.d) + '\u003c/small>\u003c/span>\u003c/button>' : ''; }).join('');\r\n  /* ІМ'Я */\r\n  if (stg === 'name' && stp === 'input') {\r\n    if (mine && !LOCAL.edit) return doneBox('Твій варіант: «' + esc(mine.v) + '»');\r\n    return task(sc.taskIn) + '\u003cinput class=\"field\" id=\"inName\" maxlength=\"24\" placeholder=\"Наприклад, Фракталія\" value=\"' + esc(mine ? mine.v : '') + '\">\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"btn ghost\" onclick=\"genName()\">🎲 Підказати\u003c/button>\u003cbutton class=\"btn cy\" onclick=\"const v=$(\\'#inName\\').value.trim();if(v)send(\\'name\\',\\'input\\',v);else toast(\\'Напиши назву 🙂\\')\">Надіслати\u003c/button>\u003c/div>';\r\n  }\r\n  if (stg === 'name' && stp === 'vote') {\r\n    const ins = SUBS.input || {}; const opts = Object.keys(ins).filter(p => S.players[p]);\r\n    if (!opts.length) return passiveView('🤔', 'Варіантів немає', 'Чекаємо на ведучого');\r\n    return task(sc.taskVote) + sshuffle(opts, PID).map(p => '\u003cbutton class=\"opt' + (p === PID ? ' dis' : '') + (mine && mine.v === p ? ' sel' : '') + '\" aceholder=\"Твоя відповідь…\">' + esc(mine ? mine.v : '') + '\u003c/textarea>\u003cdiv class=\"row\" style=\"margin-top:10px\">' + ideaBtn('inCity', tm.role.ideas || []) + '\u003cbutton class=\"btn cy\" onclick=\"const v=$(\\'#inCity\\').value.trim();if(v)send(\\'cities\\',\\'input\\',v);else toast(\\'Напиши відповідь 🙂\\')\">Надіслати\u003c/button>\u003c/div>';\r\n    }\r\n    if (stp === 'vote') {\r\n      return task(sc.taskVote) + S.teams.map(t => { const c = CONT[+t.id.slice(1)]; const own = t.id === tm.t.id; const mayor = sub('input', t.m[0]); const mod = card('mod', t.mod);\r\n        return '\u003cbutton class=\"opt' + (own ? ' dis' : '') + (mine && mine.v === t.id ? ' sel' : '') + '\" style=\"border-left:6px solid ' + c.c + '\" onclick=\"send(\\'cities\\',\\'vote\\',\\'' + t.id + '\\')\">\u003cspan class=\"em\">' + c.e + '\u003c/span>\u003cspan>' + esc(mayor ? mayor.v : c.n) + (own ? ' (твоє)' : '') + '\u003csmall>' + (mod ? mod.e + ' ' + esc(mod.n) + '\u003cbr>' : '') + t.m.slice(1).map((p, j) => { const a = sub('input', p); const r = CARDS.role[(j + 1) % CARDS.role.length] || {}; return a ? (r.e || '') + ' ' + esc(a.v) : ''; }).filter(Boolean).join('\u003cbr>') + '\u003c/small>\u003c/span>\u003c/button>'; }).join('');\r\n    }\r\n  }\r\n  /* КОНСТИТУЦІЯ */\r\n  if (stg === 'laws' && stp === 'input') {\r\n    if (mine && !LOCAL.edit) return doneBox('«' + esc((CFG.settings.lawStarts[mine.v.p] || '') + ' ' + mine.v.t) + '»');\r\n    LOCAL.lp = mine ? mine.v.p : (LOCAL.lp || 0);\r\n    const ideas = ['посміхатися перед кожним дзвінком', 'дрімати після обіду', 'приносити печиво на мітинги', 'носити різні шкарпетки щоп\\'ятниці', 'хвалити колегу щодня', 'вимикати ноутбук о 18:00', 'танцювати, коли код запрацював', 'обіймати качку раз на тиждень'];\r\n    return task(sc.taskIn) + '\u003cdiv class=\"chips\">' + CFG.settings.lawStarts.map((s, i) => '\u003cbutton class=\"chip' + (i === LOCAL.lp ? ' sel' : '') + '\" onclick=\"LOCAL.lp=' + i + ';document.querySelecto
